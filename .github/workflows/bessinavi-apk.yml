name: BES Sinavi APK
on:
  workflow_dispatch:
  push:
    branches: [bessinavi]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web dosyalarini al (bessinavi.netlify.app)
        run: |
          mkdir -p www/img tools
          curl -fsSL https://bessinavi.netlify.app/index.html -o www/index.html
          for f in zolan.jpg favicon.png og-image.jpg logo-b.png logo-b-t.png banner.jpg icon-192.png icon-512.png apple-touch-icon.png wordmark.png; do curl -fsSL https://bessinavi.netlify.app/img/$f -o www/img/$f || true; done
          grep -o 'const VER="[0-9.]*"' www/index.html | grep -o '[0-9][0-9.]*' > ver.txt
          echo "Surum: $(cat ver.txt)"
      - name: Proje dosyalari
        run: |
          cat > package.json <<'EOF'
          {"name":"bessinavi","version":"3.3.0","private":true,"dependencies":{"@capacitor/android":"8.6.2","@capacitor/cli":"8.6.2","@capacitor/core":"8.6.2"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.bessinavi.app","appName":"BES Sınavı","webDir":"www","backgroundColor":"#070b24","android":{"backgroundColor":"#070b24"}}
          EOF
          echo "" | base64 -d > tools/bes-debug.keystore
          cat > tools/brand.py <<'EOF'
          # BES Sınavı: Android ikon, açılış ekranı ve sürüm ayarları
          import os, re, shutil, glob
          VN = open("ver.txt").read().strip(); VC = VN.replace(".", "")
          from PIL import Image
          RES = "android/app/src/main/res"
          SZ = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          ic = Image.open("www/img/icon-512.png").convert("RGBA")
          for k, s in SZ.items():
              dst = os.path.join(RES, "mipmap-" + k); os.makedirs(dst, exist_ok=True)
              for n in ("ic_launcher.png", "ic_launcher_round.png"): ic.resize((s, s), Image.LANCZOS).save(os.path.join(dst, n))
          shutil.rmtree(os.path.join(RES, "mipmap-anydpi-v26"), ignore_errors=True)
          for f in glob.glob(os.path.join(RES, "mipmap-*", "ic_launcher_foreground.png")): os.remove(f)
          logo = Image.open("www/img/icon-512.png").convert("RGB")
          for f in glob.glob(os.path.join(RES, "drawable*", "splash.png")):
              w, h = Image.open(f).size
              bg = Image.new("RGB", (w, h), (7, 11, 36)); s = int(min(w, h) * 0.42)
              bg.paste(logo.resize((s, s), Image.LANCZOS), ((w - s) // 2, (h - s) // 2)); bg.save(f)
          g = "android/app/build.gradle"; t = open(g).read()
          t = re.sub(r"versionCode \d+", "versionCode " + VC, t); t = re.sub(r'versionName "[^"]*"', 'versionName "' + VN + '"', t)
          sign = """
              signingConfigs {
                  debug {
                      storeFile file("../../tools/bes-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      enableV1Signing true
                      enableV2Signing true
                  }
              }
          """
          if "bes-debug.keystore" not in t:
              t = t.replace("android {", "android {" + sign, 1)
          open(g, "w").write(t)
          v = os.path.join(RES, "values", "styles.xml")
          if os.path.exists(v):
              x = open(v).read()
              if "android:statusBarColor" not in x:
                  x = x.replace('<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">', '<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:statusBarColor">#070b24</item>\n        <item name="android:navigationBarColor">#070b24</item>')
                  open(v, "w").write(x)
          print("branding ok")
          EOF
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow && python3 tools/brand.py && npx cap sync android
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat ver.txt)
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/BES-Sinavi-v$V.apk
          gh release delete bes-v$V -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create bes-v$V out/BES-Sinavi-v$V.apk -R ${{ github.repository }} --target ${{ github.sha }} --title "BES Sinavi v$V" --notes "Android APK"
