name: Sigorta Sınavı APK
on:
  push:
    branches: [sigorta-sinavi]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK'yı hazırla
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SigortaSinavi_v2.22.3.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SigortaSinavi-apk
          path: out/SigortaSinavi_v2.22.3.apk
      - name: GitHub Release (telefondan indirme linki)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sigorta-v2.22.3 -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create sigorta-v2.22.3 out/SigortaSinavi_v2.22.3.apk -R ${{ github.repository }} --target ${{ github.sha }} --title "Sigorta Sınavı v2.22.3 (Android)" --notes "Sigorta Sınavı v2.22.3 Android APK"
