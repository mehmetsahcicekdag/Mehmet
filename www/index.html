<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>TalkTime v1.2 – Şifreli Sohbet</title>
<meta name="description" content="TalkTime: uçtan uca şifreli, sınırsız sabitleme ve link paylaşımlı sohbet uygulaması.">
<meta name="theme-color" content="#06071a">
<meta name="app-version" content="1.2">
<!-- WhatsApp / sosyal paylaşım önizlemesi -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TalkTime">
<meta property="og:title" content="TalkTime – Şifreli Sohbet">
<meta property="og:description" content="Uçtan uca şifreli sohbet. Linkleri paylaş, istediğin kadar mesaj sabitle.">
<meta property="og:image" content="https://talktime-app.netlify.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="TalkTime logosu">
<meta property="og:url" content="https://talktime-app.netlify.app/">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TalkTime – Şifreli Sohbet">
<meta name="twitter:description" content="Uçtan uca şifreli sohbet. Linkleri paylaş, istediğin kadar mesaj sabitle.">
<meta name="twitter:image" content="https://talktime-app.netlify.app/og-image.jpg">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#06071a;--bg2:#0d0f2b;--panel:#12153a;--line:#23275a;--txt:#eef0ff;--mute:#9aa0d0;
  --me1:#2a6bff;--me2:#a43cff;--other:#1a1e4a;--accent:#ff3db8;--orange:#ff9a1f;--blue:#1fb6ff;
  --ok:#2ee59d;--warn:#ffb020;--danger:#ff4d6d;--pin:#ffb020;
  --grad:linear-gradient(90deg,#1fb6ff,#7a5cff 35%,#ff3db8 65%,#ff9a1f);
  --r:18px;--fs:15px;
}
html[data-theme=light]{
  --bg:#f4f5ff;--bg2:#ffffff;--panel:#ffffff;--line:#dfe2f5;--txt:#14163a;--mute:#5d6290;--other:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt)}
a{color:#7fd0ff}
.hidden{display:none!important}
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);min-height:58px}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:8px;flex:1}
.brand img{width:34px;height:34px;border-radius:10px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.ib:active{background:var(--line)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
.pill.on{background:rgba(46,229,157,.15);color:var(--ok)}
.pill.off{background:rgba(255,77,109,.15);color:var(--danger)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700}
.btn.sec{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:var(--danger)}
.btn.full{width:100%}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);outline:none}
.field:focus{border-color:#7a5cff}
/* onboarding */
#v-onb .scroll,#v-lock .scroll{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:16px;text-align:center}
.hero{width:120px;height:120px;border-radius:30px;box-shadow:0 0 60px rgba(122,92,255,.35)}
.big{font-size:34px;font-weight:900;margin:0}
.sub{color:var(--mute);margin:0;max-width:360px}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.sel{border-color:var(--txt)}
/* list */
.chat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.chat-item:active{background:var(--panel)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex:none;position:relative}
.av.sm{width:38px;height:38px;font-size:15px}
.av .dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg2)}
.ci-main{flex:1;min-width:0}
.ci-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ci-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--mute);flex:none}
.ci-last{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--accent);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.empty{padding:40px 24px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:14px;align-items:center}
.fab{position:absolute;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--grad);color:#fff;font-size:28px;box-shadow:0 10px 30px rgba(164,60,255,.45)}
/* chat */
.hdr-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.hdr-txt{min-width:0}
.hdr-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-st{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-st.on{color:var(--ok)}
.pinbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);cursor:pointer}
.pinbar .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--pin)}
.pinbar .pt{flex:1;min-width:0}
.pinbar .pl{font-size:12px;color:var(--pin);font-weight:700}
.pinbar .pm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#msgs{padding:10px 10px 4px;display:flex;flex-direction:column;gap:3px;background:
  radial-gradient(circle at 10% 10%,rgba(31,182,255,.06),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,61,184,.06),transparent 40%)}
.e2e-note{align-self:center;max-width:90%;font-size:12px;color:var(--warn);background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.25);padding:6px 10px;border-radius:10px;text-align:center;margin:6px 0}
.day{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:3px 10px;border-radius:99px;margin:8px 0}
.m{max-width:82%;padding:7px 10px 5px;border-radius:var(--r);position:relative;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;transition:box-shadow .3s}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border-bottom-right-radius:6px}
.m.ot{align-self:flex-start;background:var(--other);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.flash{box-shadow:0 0 0 3px var(--pin)}
.m.del{opacity:.6;font-style:italic}
.m .meta{display:flex;gap:4px;justify-content:flex-end;align-items:center;font-size:11px;opacity:.75;margin-top:2px;white-space:nowrap}
.m.me a{color:#fff;text-decoration:underline}
.tick{font-size:12px;letter-spacing:-3px}
.tick.read{color:#7dffcf;opacity:1}
.m .rq{border-left:3px solid var(--orange);background:rgba(0,0,0,.18);padding:4px 8px;border-radius:8px;margin-bottom:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .rq b{display:block;font-size:12px;color:var(--orange)}
.lcard{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.2);border-radius:10px;padding:7px;margin-top:5px;text-decoration:none!important;color:inherit!important;white-space:normal}
.lcard img{width:28px;height:28px;border-radius:6px;background:#fff;flex:none}
.lcard .ld{font-weight:700;font-size:13px}
.lcard .lu{font-size:11px;opacity:.8;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reacts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.reacts span{background:rgba(0,0,0,.25);border-radius:99px;padding:0 6px;font-size:13px}
.typing{align-self:flex-start;font-size:13px;color:var(--mute);padding:4px 10px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel);outline:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px;fill:#fff}
.replyprev{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-top:1px solid var(--line)}
.replyprev .rp{flex:1;min-width:0;border-left:3px solid var(--orange);padding-left:8px}
.replyprev .rp b{font-size:12px;color:var(--orange)}
.replyprev .rp div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
/* sheet */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sh-h h3{margin:0;font-size:17px;flex:1}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0}
.sh-b{overflow-y:auto;padding:4px 16px 16px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left}
.act:last-child{border-bottom:0}
.act .ai{width:26px;text-align:center;font-size:18px}
.act.red{color:var(--danger)}
.rx-row{display:flex;justify-content:space-between;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.rx-row button{font-size:26px;width:44px;height:44px;border-radius:50%}
.rx-row button:active{background:var(--line)}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li .lt{flex:1;min-width:0}
.li .lsub{font-size:12px;color:var(--mute)}
.li .ltxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lnote{font-size:12px;color:var(--pin);font-weight:700}
.li .lbtns{display:flex;gap:2px}
.li .lbtns button{width:34px;height:34px;border-radius:10px;font-size:15px}
.li .lbtns button:active{background:var(--line)}
.li img{width:28px;height:28px;border-radius:6px;background:#fff;flex:none;margin-top:2px}
.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.seg button.sel{background:var(--grad);color:#fff;border-color:transparent}
.linkbox{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;word-break:break-all;font-size:13px;margin:8px 0}
.row2{display:flex;gap:8px;margin-top:8px}
.row2>*{flex:1}
.code{font:700 22px/1.5 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:10px 0}
/* settings */
.sec-t{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:1px;padding:18px 16px 6px}
.set{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.set .st{flex:1;min-width:0}
.set .sd{font-size:12px;color:var(--mute)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:linear-gradient(90deg,#1fb6ff,#a43cff)}
.sw input:checked+span:before{transform:translateX(20px)}
.set select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
.ver{font-size:12px;color:var(--mute);text-align:center;padding:20px}
mark{background:var(--pin);color:#000;border-radius:3px}
.pinico{color:var(--pin)}
.lockdots{display:flex;gap:12px;justify-content:center}
.lockdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}
.lockdots i.f{background:var(--grad);border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:50%;background:var(--panel);font-size:24px;font-weight:700;border:1px solid var(--line)}
.pad button:active{background:var(--line)}
</style>
</head>
<body>

<!-- KİLİT EKRANI -->
<section id="v-lock" class="view hidden">
  <div class="scroll">
    <img class="hero" src="icons/bubble.png" alt="">
    <h2 class="big gt">TalkTime</h2>
    <p class="sub" id="lock-msg">PIN kodunu gir</p>
    <div class="lockdots" id="lock-dots"></div>
    <div class="pad" id="lock-pad"></div>
    <button class="pill" id="lock-forgot">PIN'i unuttum</button>
  </div>
</section>

<!-- KARŞILAMA -->
<section id="v-onb" class="view hidden">
  <div class="scroll">
    <img class="hero" src="icons/bubble.png" alt="">
    <h2 class="big gt">TalkTime</h2>
    <p class="sub">Uçtan uca şifreli sohbet. Linkleri paylaş, istediğin kadar mesaj sabitle.</p>
    <input id="onb-name" class="field" maxlength="30" placeholder="Adın (karşı taraf bunu görür)" style="max-width:360px">
    <div class="colors" id="onb-colors"></div>
    <button class="btn" id="onb-go" style="min-width:220px">Başla</button>
    <p class="sub" style="font-size:12px">Hesap, telefon numarası ya da e-posta gerekmez.</p>
  </div>
</section>

<!-- SOHBET LİSTESİ -->
<section id="v-list" class="view hidden">
  <div class="top">
    <div class="brand"><img src="icons/bubble.png" alt=""><h1 class="gt">TalkTime</h1></div>
    <span class="pill" id="net-pill">bağlanıyor</span>
    <button class="ib" id="btn-settings" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="scroll" id="chat-list"></div>
  <button class="fab" id="btn-new" aria-label="Yeni sohbet">+</button>
</section>

<!-- SOHBET -->
<section id="v-chat" class="view hidden">
  <div class="top">
    <button class="ib" id="chat-back" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="hdr-info" id="chat-hdr"></div>
    <button class="ib" id="btn-links" aria-label="Linkler">🔗</button>
    <button class="ib" id="btn-pins" aria-label="Sabitlenenler">📌</button>
    <button class="ib" id="btn-more" aria-label="Menü"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </div>
  <div class="pinbar hidden" id="pinbar"></div>
  <div class="scroll" id="msgs"></div>
  <div class="replyprev hidden" id="replyprev"></div>
  <div class="composer">
    <button class="ib" id="btn-attachlink" aria-label="Link paylaş">🔗</button>
    <textarea id="inp" rows="1" placeholder="Mesaj yaz"></textarea>
    <button class="send" id="btn-send" aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.9L3.4 3.6c-.7-.3-1.4.2-1.4.9L2 9.1c0 .5.4.9.9 1l13.1 1.9-13.1 1.9c-.5.1-.9.5-.9 1l.01 4.6c0 .7.7 1.2 1.4.9z"/></svg></button>
  </div>
</section>

<!-- AYARLAR -->
<section id="v-settings" class="view hidden">
  <div class="top">
    <button class="ib" id="set-back" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 style="flex:1">Ayarlar</h1>
  </div>
  <div class="scroll" id="set-body"></div>
</section>

<div id="shade" class="hidden"></div>

"use strict";
/* ================= TalkTime v1.2 ================= */
const VERSION = "1.2";
const LS = "talktime_v1";
const COLORS = ["#2a6bff","#a43cff","#ff3db8","#ff9a1f","#1fb6ff","#2ee59d","#ff4d6d","#7a5cff"];
const REACTS = ["❤️","👍","😂","😮","😢","🙏"];
const DEF_SETTINGS = {
  e2ee:true, readReceipts:true, typing:true, presence:true, linkPreview:true, pinBar:true, syncPins:true,
  reactions:true, enterSend:false, sound:true, vibrate:true, notify:false, dayDividers:true,
  theme:"dark", fontSize:"15", lock:false, screenshot:false, keyWarn:true, demo:true
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();

let S = null;            // kalıcı durum
let pinKey = null;       // PIN'den türetilen AES anahtarı (kilit açıkken)
let peer = null;

const rt = {};           // geçici durum (yazıyor, paylaşılan anahtarlar vs.)

let pinIdx = 0;

/* ---------- yardımcılar ---------- */
function toast(t, ms = 2200){ const e = $("#toast"); e.textContent = t; e.classList.remove("hidden"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.add("hidden"), ms); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"}); }
function fmtDay(ts){
  const d = new Date(ts), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Bugün";
  if (d.toDateString() === y.toDateString()) return "Dün";

/* ---------- kalıcı depolama (+ PIN şifrelemesi) ---------- */
async function pinDerive(pin, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 150); }
async function saveNow(){
  if (!S) return;

    if (S.settings.lock && pinKey){
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, pinKey, new TextEncoder().encode(json));
      localStorage.setItem(LS, JSON.stringify({locked:true, salt:S._salt, iv:b64(iv), ct:b64(ct)}));
    } else localStorage.setItem(LS, json);
  } catch(e){ toast("Kaydedilemedi: depolama dolu olabilir"); }
}

/* ---------- uçtan uca şifreleme ---------- */
async function ensureIdentity(){
  if (S.keys?.priv) return;
  const kp = await crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveKey"]);
  S.keys = { priv: await crypto.subtle.exportKey("jwk", kp.privateKey), pub: await crypto.subtle.exportKey("jwk", kp.publicKey) };
  save();
}
async function sharedKey(pid){
  const ch = S.chats[pid]; if (!ch?.pub) return null;
  rt[pid] = rt[pid] || {};
  if (rt[pid].key && rt[pid].keyFor === ch.pub.x) return rt[pid].key;
  const priv = await crypto.subtle.importKey("jwk", S.keys.priv, {name:"ECDH", namedCurve:"P-256"}, false, ["deriveKey"]);
  const pub = await crypto.subtle.importKey("jwk", ch.pub, {name:"ECDH", namedCurve:"P-256"}, false, []);
  rt[pid].key = await crypto.subtle.deriveKey({name:"ECDH", public:pub}, priv, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  rt[pid].keyFor = ch.pub.x;
  return rt[pid].key;
}
async function safetyCode(pid){
  const ch = S.chats[pid]; if (!ch?.pub) return null;
  const a = S.keys.pub.x + S.keys.pub.y, b = ch.pub.x + ch.pub.y;
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode([a, b].sort().join("|"))));
  let digits = ""; for (let i = 0; i < 12; i++) digits += (h[i] % 10);
  return digits.replace(/(\d{4})(?=\d)/g, "$1 ");
}

function showLock(raw){
  showView("lock");
  let pin = ""; const dots = $("#lock-dots"), pad = $("#lock-pad");
  const draw = () => dots.innerHTML = [0,1,2,3].map(i => `<i class="${i < pin.length ? "f" : ""}"></i>`).join("");
  pad.innerHTML = [1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k => k === "" ? "<span></span>" : `<button data-k="${k}">${k}</button>`).join("");
  draw();

    const k = e.target.dataset?.k; if (k === undefined) return;

    if (pin.length >= 4) return;
    pin += k; draw();
    if (pin.length === 4){
      try {
        const key = await pinDerive(pin, unb64(raw.salt));
        const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(raw.iv)}, key, unb64(raw.ct));
        S = JSON.parse(new TextDecoder().decode(pt)); pinKey = key; afterLoad();

    }
  };
  $("#lock-forgot").onclick = () => {
    if (confirm("PIN olmadan veriler açılamaz. Tüm sohbetler silinip uygulama sıfırlansın mı?")){ localStorage.removeItem(LS); location.reload(); }

}

    {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"}
  ]}};

function setNet(st){

function startPeer(){

  peer.on("error", e => {

    else if (e.type === "peer-unavailable"){ /* karşı taraf çevrimdışı – mesajlar sırada bekler */ }
    else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error"){ setNet("offline"); }

function isOnline(pid){ if (S.chats[pid]?.demo) return true; return !!(conns[pid] && conns[pid].open); }
function connectTo(pid){
  if (S.chats[pid]?.demo) return;
  if (!peer || peer.disconnected || !pid || pid === S.me.id || isOnline(pid)) return;
  rt[pid] = rt[pid] || {};
  if (rt[pid].dialing && now() - rt[pid].dialing < 10000) return;
  rt[pid].dialing = now();
  const c = peer.connect(pid, {reliable:true, serialization:"json"});

}
function reconnectAll(){ if (!peer || !peer.open) return; for (const pid in S.chats) if (!S.chats[pid].deleted) connectTo(pid); }
function setupConn(c, out){
  c._out = out;
  c.on("open", () => {
    const pid = c.peer; rt[pid] = rt[pid] || {}; rt[pid].dialing = 0;
    const old = conns[pid];
    if (old && old !== c && old.open){
      // iki taraf aynı anda bağlandıysa: küçük ID'nin başlattığı bağlantı kalır
      const init = x => x._out ? S.me.id : pid;
      const keep = [S.me.id, pid].sort()[0];
      if (init(old) === keep){ try { c.close(); } catch(e){} return; }
      try { old.close(); } catch(e){}
    }
    conns[pid] = c;
    rawSend(pid, {t:"hello", name:S.me.name, color:S.me.color, v:VERSION, pub:S.keys.pub, presence:S.settings.presence});
    renderAll();
  });
  c.on("data", d => onData(c.peer, d).catch(err => console.warn(err)));
  c.on("close", () => {
    if (conns[c.peer] === c){
      delete conns[c.peer];
      const ch = S.chats[c.peer]; if (ch){ ch.lastSeen = now(); save(); }
      if (rt[c.peer]) rt[c.peer].typing = false;
      renderAll();
    }
  });

}
function rawSend(pid, obj){ const c = conns[pid]; if (c && c.open){ try { c.send(obj); return true; } catch(e){} } return false; }
async function send(pid, obj){
  if (S.chats[pid]?.demo){ demoHandle(pid, obj); return true; }
  if (!isOnline(pid)) return false;
  const ch = S.chats[pid];
  if (S.settings.e2ee && ch?.pub){
    const key = await sharedKey(pid);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
    return rawSend(pid, {t:"enc", iv:b64(iv), ct:b64(ct)});
  }

/* ---------- sohbet verisi ---------- */
function newChat(pid, name, color){
  const ch = { id:pid, name:name || "Yeni kişi", color:color || "#7a5cff", messages:[], pins:[], pinTomb:{}, unread:0,
               created:now(), lastAct:now(), pinnedChat:0, timer:0, draft:"" };
  S.chats[pid] = ch; save(); return ch;
}
function ackRank(s){ return {pending:0, sent:1, delivered:2, read:3}[s] ?? 0; }
async function flush(pid){
  const ch = S.chats[pid]; if (!ch || ch.demo) return;
  for (const m of ch.messages){
    if (m.from === S.me.id && ackRank(m.status) < 2 && !m.deleted){
      if (await send(pid, {t:"msg", m:wire(m)}) && m.status === "pending") m.status = "sent";
    }
  }
  // bekleyen düzenleme/silme/tepki olayları
  if (ch.outbox?.length){ const ob = ch.outbox; ch.outbox = []; for (const o of ob) if (!(await send(pid, o))) (ch.outbox ||= []).push(o); }
  if (S.settings.syncPins) await send(pid, {t:"pins", pins:ch.pins, tomb:ch.pinTomb});
  await send(pid, {t:"timer", v:ch.timer, ts:ch.timerTs || 0});
  save(); if (cur === pid) renderMsgs();
}
function wire(m){ return {id:m.id, from:m.from, text:m.text, ts:m.ts, replyTo:m.replyTo || null, exp:m.exp || 0}; }
async function queueOrSend(pid, obj){ if (!(await send(pid, obj))){ const ch = S.chats[pid]; (ch.outbox ||= []).push(obj); save(); } }

async function onData(pid, d){
  if (!d || typeof d !== "object") return;
  if (d.t === "enc"){
    const key = await sharedKey(pid); if (!key) return;
    try { d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(d.iv)}, key, unb64(d.ct)))); }
    catch(e){ console.warn("şifre çözülemedi"); return; }
    if (!d || typeof d !== "object") return;
  }
  let ch = S.chats[pid];
  if (d.t === "hello"){
    if (!ch) ch = newChat(pid, d.name, d.color);
    if (ch.deleted){ delete ch.deleted; }
    ch.name = String(d.name || ch.name).slice(0, 30); ch.color = /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : ch.color;
    ch.hidePresence = d.presence === false;
    if (d.pub && d.pub.x){
      if (ch.pub && ch.pub.x !== d.pub.x && S.settings.keyWarn) ch.keyChanged = now();
      ch.pub = {kty:d.pub.kty, crv:d.pub.crv, x:d.pub.x, y:d.pub.y, ext:true};
    }
    save(); renderAll();
    await flush(pid);
    if (cur === pid && !document.hidden) markRead(pid);
    return;
  }
  if (!ch) ch = newChat(pid, "Yeni kişi", "#7a5cff");
  switch (d.t){
    case "msg": {
      const m = d.m; if (!m || !m.id || typeof m.text !== "string") break;
      if (!ch.messages.some(x => x.id === m.id)){
        const msg = {id:m.id, from:pid, text:m.text.slice(0, 20000), ts:+m.ts || now(), replyTo:m.replyTo || null, exp:+m.exp || 0, status:"recv", rx:{}};
        ch.messages.push(msg); ch.messages.sort((a, b) => a.ts - b.ts); ch.lastAct = now();
        const seen = cur === pid && !document.hidden;
        if (!seen){ ch.unread = (ch.unread || 0) + 1; notifyNew(ch, msg); }
        else { beep(); }
        if (rt[pid]) rt[pid].typing = false;
      }
      await send(pid, {t:"ack", ids:[m.id], s:"delivered"});
      save(); renderAll();
      if (cur === pid && !document.hidden) markRead(pid);
      break;
    }
    case "ack": {
      let ch2 = false;
      for (const id of (d.ids || [])){ const m = ch.messages.find(x => x.id === id); if (m && m.from === S.me.id && ackRank(d.s) > ackRank(m.status)){ m.status = d.s; if (d.s === "read" && m.exp && !m.expAt) m.expAt = now() + m.exp; ch2 = true; } }
      if (ch2){ save(); if (cur === pid) renderMsgs(); else renderList(); }
      break;
    }
    case "typing": rt[pid] = rt[pid] || {}; rt[pid].typing = !!d.on; clearTimeout(rt[pid].tt); if (d.on) rt[pid].tt = setTimeout(() => { rt[pid].typing = false; renderHeader(); }, 6000); renderHeader(); renderList(); break;
    case "edit": { const m = ch.messages.find(x => x.id === d.id && x.from === pid); if (m && typeof d.text === "string"){ m.text = d.text.slice(0, 20000); m.edited = now(); save(); renderAll(); } break; }
    case "del": { const m = ch.messages.find(x => x.id === d.id && x.from === pid); if (m){ m.text = ""; m.deleted = true; unpinLocal(ch, m.id); save(); renderAll(); } break; }
    case "react": { const m = ch.messages.find(x => x.id === d.id); if (m){ m.rx = m.rx || {}; if (d.e) m.rx[pid] = String(d.e).slice(0, 8); else delete m.rx[pid]; save(); renderAll(); } break; }
    case "pins": if (S.settings.syncPins) mergePins(ch, d.pins || [], d.tomb || {}); break;
    case "timer": if ((d.ts || 0) > (ch.timerTs || 0)){ ch.timer = +d.v || 0; ch.timerTs = d.ts; save(); renderAll(); } break;
  }
}

/* ---------- mesaj işlemleri ---------- */
async function sendText(text){
  text = text.replace(/\s+$/, ""); if (!text.trim()) return;
  const ch = S.chats[cur]; if (!ch) return;
  const m = {id:uid(), from:S.me.id, text, ts:now(), replyTo:replyTo, status:"pending", rx:{}, exp:ch.timer || 0};
  ch.messages.push(m); ch.lastAct = now(); ch.draft = "";
  setReply(null); save(); renderMsgs(true); renderHeader();
  if (await send(cur, {t:"msg", m:wire(m)})){ m.status = "sent"; save(); renderMsgs(); }
  else connectTo(cur);
  vib(15);
}
function markRead(pid){
  const ch = S.chats[pid]; if (!ch) return;
  const ids = [];
  for (const m of ch.messages) if (m.from !== S.me.id && !m.readByMe){ m.readByMe = true; ids.push(m.id); if (m.exp && !m.expAt) m.expAt = now() + m.exp; }
  if (ch.unread){ ch.unread = 0; }
  if (ids.length){ save(); if (S.settings.readReceipts) send(pid, {t:"ack", ids, s:"read"}); }
}
function sweepExpired(){
  const t = now(); let changed = false;
  for (const pid in S.chats){
    const ch = S.chats[pid];
    const before = ch.messages.length;
    ch.messages = ch.messages.filter(m => !(m.expAt && m.expAt <= t));
    if (ch.messages.length !== before){ changed = true; const ids = new Set(ch.messages.map(m => m.id)); ch.pins = ch.pins.filter(p => ids.has(p.id)); }
  }
  if (changed){ save(); renderAll(); }
}

/* ---------- sabitleme (sınırsız) ---------- */
function isPinned(ch, id){ return ch.pins.some(p => p.id === id); }
function pinMsg(ch, id, note){
  if (isPinned(ch, id)) return;
  ch.pins.push({id, ts:now(), note:note || "", by:S.me.id}); delete ch.pinTomb[id];
  save(); syncPins(ch); renderAll(); toast("📌 Sabitlendi (" + ch.pins.length + ")"); vib(20);
}
function unpinLocal(ch, id){ const i = ch.pins.findIndex(p => p.id === id); if (i >= 0){ ch.pins.splice(i, 1); ch.pinTomb[id] = now(); return true; } return false; }
function unpinMsg(ch, id){ if (unpinLocal(ch, id)){ save(); syncPins(ch); renderAll(); toast("Sabitleme kaldırıldı"); } }
function syncPins(ch){ if (S.settings.syncPins) send(ch.id, {t:"pins", pins:ch.pins, tomb:ch.pinTomb}); }
function mergePins(ch, pins, tomb){
  let changed = false;
  for (const [id, ts] of Object.entries(tomb)){ const p = ch.pins.find(x => x.id === id); if (p && p.ts < ts){ unpinLocal(ch, id); ch.pinTomb[id] = ts; changed = true; } else if (!ch.pinTomb[id] || ch.pinTomb[id] < ts){ ch.pinTomb[id] = ts; } }
  for (const p of pins){
    if (!p || !p.id || !ch.messages.some(m => m.id === p.id)) continue;
    const local = ch.pins.find(x => x.id === p.id);
    if (!local && (!ch.pinTomb[p.id] || ch.pinTomb[p.id] < p.ts)){ ch.pins.push({id:p.id, ts:p.ts, note:String(p.note || "").slice(0, 60), by:p.by}); delete ch.pinTomb[p.id]; changed = true; }
    else if (local && p.note !== local.note && p.ts >= local.ts){ local.note = String(p.note || "").slice(0, 60); changed = true; }
  }
  if (changed){ save(); renderAll(); }
}

/* ---------- bildirim ---------- */
function notifyNew(ch, m){
  beep(); vib([30, 40, 30]);
  if (!S.settings.notify || !("Notification" in window) || Notification.permission !== "granted") return;
  if (!document.hidden && cur === ch.id) return;

/* ---------- davet linki ---------- */
function inviteLink(){
  const web = location.protocol.startsWith("http") && !window.Capacitor && location.hostname !== "localhost";
  const base = web ? location.origin + location.pathname : "https://talktime-app.netlify.app/";
  return base + "?join=" + encodeURIComponent(S.me.id) + "&n=" + encodeURIComponent(S.me.name);
}
function handleJoin(){
  const q = new URLSearchParams(location.search);
  const jid = q.get("join"); if (!jid) return;
  q.delete("join"); const n = q.get("n"); q.delete("n");
  history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
  if (jid === S.me.id){ toast("Bu senin kendi davet linkin. Karşı tarafa gönder."); return; }
  let ch = S.chats[jid];
  if (!ch) ch = newChat(jid, n || "Yeni kişi", "#7a5cff");
  delete ch.deleted; save();
  connectTo(jid); openChat(jid);
  toast("Bağlanılıyor… Karşı taraf uygulamayı açınca sohbet başlar.", 3500);
}

const DEMO_TIPS = [

function demoReply(text){
  const q = text.toLocaleLowerCase("tr-TR");
  if (findLinks(text).length) return "Linkini aldım 🔗 Üstteki 🔗 düğmesine bas: paylaşılan tüm linkler orada, aranabilir ve sabitlenebilir.";
  if (q.includes("sabitle") || q.includes("pin")) return "Sabitleme sınırsız 📌 Mesaja dokun → Sabitle. İstersen etiket de ekle (Önemli, Adres, Yapılacak…).";
  if (q.includes("şifre") || q.includes("kripto") || q.includes("güven")) return "Gerçek sohbetlerde her mesaj telefonda kilitlenir, sadece karşı tarafın telefonunda açılır 🔒 ⋮ → Güvenlik kodu ile doğrulayabilirsin.";
  if (q.includes("merhaba") || q.includes("selam")) return "Selam " + S.me.name + "! 😊 " + DEMO_TIPS[0];
  if (q.includes("davet") || q.includes("bağlan") || q.includes("nasıl")) return "Ana ekrana dön → + düğmesi → linki WhatsApp'tan gönder. Karşı taraf tıklayınca sohbetiniz başlar. Kod ile bağlan seçeneği de var.";
  const ch = S.chats[DEMO_ID]; ch._tip = ((ch._tip || 0) + 1) % DEMO_TIPS.length; return DEMO_TIPS[ch._tip];
}
function demoHandle(pid, obj){
  const ch = S.chats[pid]; if (!ch) return;
  if (obj.t !== "msg") return;
  const m = ch.messages.find(x => x.id === obj.m.id); if (!m) return;
  setTimeout(() => { m.status = "delivered"; save(); if (cur === pid) renderMsgs(); }, 400);
  setTimeout(() => { m.status = "read"; if (m.exp && !m.expAt) m.expAt = now() + m.exp; save(); if (cur === pid) renderMsgs(); }, 900);
  setTimeout(() => { rt[pid] = rt[pid] || {}; rt[pid].typing = true; renderHeader(); if (cur === pid) renderMsgs(); }, 1100);
  setTimeout(() => {
    rt[pid].typing = false;
    const r = {id:"d" + uid(), from:pid, text:demoReply(m.text), ts:now(), status:"recv", rx:{}, exp:ch.timer || 0};
    ch.messages.push(r); ch.lastAct = now();
    if (cur === pid && !document.hidden){ r.readByMe = true; if (r.exp) r.expAt = now() + r.exp; beep(); } else { ch.unread = (ch.unread || 0) + 1; }
    save(); renderAll();
  }, 2300);
}

/* ================= RENDER ================= */
function renderAll(){ renderList(); if (cur){ renderHeader(); renderMsgs(); renderPinbar(); } }
function lastPreview(ch){
  const m = [...ch.messages].reverse().find(x => !x.deleted) || ch.messages[ch.messages.length - 1];
  if (rt[ch.id]?.typing && S.settings.typing) return '<span style="color:var(--ok)">yazıyor…</span>';

  const pre = m.from === S.me.id ? tickHtml(m) + " " : "";
  return pre + esc(m.deleted ? "Mesaj silindi" : (findLinks(m.text).length ? "🔗 " : "") + m.text.replace(/\n/g, " ").slice(0, 80));
}
function renderList(){
  const box = $("#chat-list"); if (!box || !S?.me) return;
  const list = Object.values(S.chats).filter(c => !c.deleted).sort((a, b) => (b.pinnedChat ? 1 : 0) - (a.pinnedChat ? 1 : 0) || (b.pinnedChat - a.pinnedChat) || b.lastAct - a.lastAct);
  if (!list.length){
    box.innerHTML = `<div class="empty"><img src="icons/bubble.png" style="width:90px;border-radius:24px" alt="">

  }
  const realCount = list.filter(c => !c.demo).length;
  const banner = realCount ? "" : `<div class="empty" style="padding:18px 20px;gap:10px;border-bottom:1px solid var(--line)">
      <span>Gerçek sohbete başlamak için bir arkadaşını davet et. Önce menüleri keşfetmek istersen <b>TalkTime Rehber</b> sohbetini aç.</span>
      <div class="row2" style="width:100%;margin:0"><button class="btn" onclick="openInvite()">Davet et</button><button class="btn sec" onclick="openCodeJoin()">Kod ile bağlan</button></div></div>`;
  box.innerHTML = banner + list.map(ch => {
    const last = ch.messages[ch.messages.length - 1];
    const on = isOnline(ch.id) && !ch.hidePresence && S.settings.presence;
    return `<div class="chat-item" data-open="${esc(ch.id)}">
      <div class="av" style="background:${esc(ch.color)}">${esc(initial(ch.name))}${on ? '<span class="dot"></span>' : ""}</div>
      <div class="ci-main">
        <div class="ci-row"><span class="ci-name">${ch.pinnedChat ? '<span class="pinico">📌</span> ' : ""}${esc(ch.name)}${ch.demo ? ' <span class="pill" style="font-size:10px">deneme</span>' : ""}</span><span class="ci-time">${last ? fmtShort(last.ts) : ""}</span></div>
        <div class="ci-row"><span class="ci-last">${lastPreview(ch)}</span>${ch.unread ? `<span class="badge">${ch.unread}</span>` : ""}</div>
      </div></div>`;
  }).join("");
}
function tickHtml(m){
  if (m.from !== S.me.id) return "";
  if (m.status === "pending") return '<span class="tick" title="Bekliyor">🕓</span>';
  if (m.status === "sent") return '<span class="tick" title="Gönderildi">✓</span>';
  if (m.status === "delivered") return '<span class="tick" title="İletildi">✓✓</span>';
  return '<span class="tick read" title="Okundu">✓✓</span>';
}
function statusLine(ch){
  if (rt[ch.id]?.typing && S.settings.typing) return {t:"yazıyor…", on:true};
  if (ch.demo) return {t:"deneme sohbeti · çevrimiçi", on:true};
  if (!S.settings.presence || ch.hidePresence) return {t: S.settings.e2ee ? "🔒 uçtan uca şifreli" : "", on:false};
  if (isOnline(ch.id)) return {t:"çevrimiçi" + (S.settings.e2ee ? " · 🔒 şifreli" : ""), on:true};
  if (ch.lastSeen) return {t:"son görülme " + fmtDay(ch.lastSeen).toLocaleLowerCase("tr-TR") + " " + fmtTime(ch.lastSeen), on:false};
  return {t:"bağlantı bekleniyor…", on:false};
}
function renderHeader(){
  const ch = S.chats[cur]; if (!ch) return;
  const st = statusLine(ch);
  $("#chat-hdr").innerHTML = `<div class="av sm" style="background:${esc(ch.color)}">${esc(initial(ch.name))}</div>
    <div class="hdr-txt"><div class="hdr-name">${esc(ch.name)}</div><div class="hdr-st ${st.on ? "on" : ""}">${esc(st.t)}${ch.timer ? " · ⏱ " + timerLabel(ch.timer) : ""}</div></div>`;

function renderPinbar(){
  const ch = S.chats[cur]; const bar = $("#pinbar");
  if (!ch || !S.settings.pinBar || !ch.pins.length){ bar.classList.add("hidden"); return; }
  if (pinIdx >= ch.pins.length) pinIdx = 0;
  const p = ch.pins[ch.pins.length - 1 - pinIdx]; const m = ch.messages.find(x => x.id === p.id);
  bar.classList.remove("hidden");

    <div class="pm">${esc(m ? (m.deleted ? "Mesaj silindi" : m.text.replace(/\n/g, " ")) : "")}</div></div>
    <button class="ib" id="pinbar-all" aria-label="Tümü">☰</button>`;
}
function renderMsgs(scrollEnd){
  const ch = S.chats[cur]; if (!ch) return;
  const box = $("#msgs"); const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let html = "";
  if (ch.demo) html += `<div class="e2e-note" style="color:var(--blue);border-color:rgba(31,182,255,.35);background:rgba(31,182,255,.08)">🎯 Bu bir deneme sohbetidir. Mesajların telefonundan dışarı çıkmaz; tüm menüleri gönül rahatlığıyla dene.</div>`;
  else if (S.settings.e2ee) html += `<div class="e2e-note">🔒 Mesajlar uçtan uca şifrelidir. Sadece siz ikiniz okuyabilirsiniz, sunucu dahil kimse göremez.</div>`;
  if (ch.keyChanged) html += `<div class="e2e-note" style="color:var(--danger);border-color:var(--danger)">⚠️ ${esc(ch.name)} kişisinin güvenlik kodu değişti (yeni cihaz ya da sıfırlama olabilir). Menüden kodu birlikte kontrol edin.</div>`;
  let lastDay = "";
  const byId = {}; for (const m of ch.messages) byId[m.id] = m;
  for (const m of ch.messages){
    const day = new Date(m.ts).toDateString();
    if (S.settings.dayDividers && day !== lastDay){ html += `<div class="day">${fmtDay(m.ts)}</div>`; lastDay = day; }
    const mine = m.from === S.me.id;
    let inner = "";
    if (m.replyTo && byId[m.replyTo]){ const r = byId[m.replyTo]; inner += `<div class="rq" data-jump="${esc(r.id)}"><b>${r.from === S.me.id ? "Sen" : esc(ch.name)}</b>${esc(r.deleted ? "Mesaj silindi" : r.text.slice(0, 100))}</div>`; }
    if (m.deleted) inner += "🚫 Bu mesaj silindi";
    else {
      inner += linkify(m.text);
      if (S.settings.linkPreview){
        const links = [...new Set(findLinks(m.text))].slice(0, 3);
        for (const u of links) inner += `<a class="lcard" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(domainOf(u))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="ld">${esc(domainOf(u))}</div><div class="lu">${esc(u)}</div></div></a>`;
      }
    }
    const rx = m.rx ? Object.values(m.rx) : [];
    if (S.settings.reactions && rx.length){ const cnt = {}; rx.forEach(e => cnt[e] = (cnt[e] || 0) + 1); inner += `<div class="reacts">${Object.entries(cnt).map(([e, n]) => `<span>${esc(e)}${n > 1 ? n : ""}</span>`).join("")}</div>`; }
    const pinned = isPinned(ch, m.id);
    inner += `<div class="meta">${m.exp ? "⏱" : ""}${pinned ? '<span class="pinico">📌</span>' : ""}${m.edited ? "düzenlendi ·" : ""} ${fmtTime(m.ts)} ${tickHtml(m)}</div>`;
    html += `<div class="m ${mine ? "me" : "ot"} ${m.deleted ? "del" : ""}" data-mid="${esc(m.id)}">${inner}</div>`;
  }
  if (rt[cur]?.typing && S.settings.typing) html += `<div class="typing">${esc(ch.name)} yazıyor…</div>`;
  const pend = ch.messages.filter(m => m.from === S.me.id && m.status === "pending").length;
  if (pend && !isOnline(cur)) html += `<div class="e2e-note">🕓 ${pend} mesaj sırada. ${esc(ch.name)} uygulamayı açınca otomatik iletilecek.</div>`;
  box.innerHTML = html;
  if (scrollEnd || atEnd) box.scrollTop = box.scrollHeight;
}
function timerLabel(v){ return {60000:"1 dk", 3600000:"1 sa", 86400000:"1 gün", 604800000:"7 gün"}[v] || ""; }

/* ---------- sohbet aç/kapa ---------- */

async function copy(t, msg){

}

      if (cur_ === em) delete m.rx[S.me.id]; else m.rx[S.me.id] = em;
      save(); queueOrSend(cur, {t:"react", id, e:m.rx[S.me.id] || ""}); closeSheet(); renderMsgs(); return;
    }
    const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
    closeSheet();
    if (a === "reply") setReply(id);
    else if (a === "copy") copy(m.text);
    else if (a === "pin") pinMsg(ch, id);
    else if (a === "pinnote"){ const n = prompt("Sabitleme etiketi (ör. Önemli, Adres, Yapılacak):", ""); if (n !== null) pinMsg(ch, id, n.trim().slice(0, 60)); }
    else if (a === "unpin") unpinMsg(ch, id);
    else if (a === "note"){ const p = ch.pins.find(x => x.id === id); const n = prompt("Sabitleme etiketi:", p.note || ""); if (n !== null){ p.note = n.trim().slice(0, 60); p.ts = now(); save(); syncPins(ch); renderAll(); } }
    else if (a === "copylink") copy(links.join("\n"), links.length > 1 ? "Linkler kopyalandı" : "Link kopyalandı");
    else if (a === "openlink") openExt(links[0]);
    else if (a === "edit"){ const n = prompt("Mesajı düzenle:", m.text); if (n !== null && n.trim() && n !== m.text){ m.text = n; m.edited = now(); save(); queueOrSend(cur, {t:"edit", id, text:n}); renderAll(); } }
    else if (a === "info"){
      openSheet("Mesaj bilgisi", `<div class="li"><div class="lt"><div class="lsub">Gönderen</div>${m.from === S.me.id ? "Sen" : esc(ch.name)}</div></div>
        <div class="li"><div class="lt"><div class="lsub">Zaman</div>${new Date(m.ts).toLocaleString("tr-TR")}</div></div>
        ${mine ? `<div class="li"><div class="lt"><div class="lsub">Durum</div>${{pending:"Sırada bekliyor", sent:"Gönderildi", delivered:"İletildi", read:"Okundu"}[m.status]}</div></div>` : ""}
        <div class="li"><div class="lt"><div class="lsub">Şifreleme</div>${S.settings.e2ee ? "🔒 Uçtan uca şifreli (AES-256-GCM)" : "Kapalı"}</div></div>
        ${m.exp ? `<div class="li"><div class="lt"><div class="lsub">Kendini silme</div>${timerLabel(m.exp)} sonra</div></div>` : ""}`);
    }
    else if (a === "delme"){ ch.messages = ch.messages.filter(x => x.id !== id); unpinLocal(ch, id); save(); renderAll(); }
    else if (a === "delall"){ if (confirm("Mesaj iki taraftan da silinsin mi?")){ m.text = ""; m.deleted = true; unpinLocal(ch, id); save(); queueOrSend(cur, {t:"del", id}); syncPins(ch); renderAll(); } }
  };
}

/* ---------- Sabitlenenler paneli ---------- */
let pinSort = "pin", pinFilter = "";
function openPins(){
  const ch = S.chats[cur];
  const draw = () => {
    let list = ch.pins.map(p => ({p, m:ch.messages.find(x => x.id === p.id)})).filter(x => x.m);
    if (pinSort === "msg") list.sort((a, b) => a.m.ts - b.m.ts); else list.reverse();
    const notes = [...new Set(ch.pins.map(p => p.note).filter(Boolean))];
    if (pinFilter) list = list.filter(x => x.p.note === pinFilter);
    let h = `<div class="seg"><button data-s="pin" class="${pinSort === "pin" ? "sel" : ""}">Son sabitlenen</button><button data-s="msg" class="${pinSort === "msg" ? "sel" : ""}">Mesaj tarihi</button></div>`;
    if (notes.length) h += `<div class="seg"><button data-f="" class="${!pinFilter ? "sel" : ""}">Tümü</button>${notes.map(n => `<button data-f="${esc(n)}" class="${pinFilter === n ? "sel" : ""}">🏷️ ${esc(n)}</button>`).join("")}</div>`;
    if (!list.length) h += `<div class="empty">Henüz sabitlenen mesaj yok.<br>Bir mesaja dokun → <b>Sabitle</b>. Sınır yok, istediğin kadar sabitleyebilirsin.</div>`;
    h += list.map(({p, m}) => `<div class="li"><div class="lt" data-go="${esc(m.id)}">
        ${p.note ? `<div class="lnote">🏷️ ${esc(p.note)}</div>` : ""}
        <div class="ltxt">${esc(m.deleted ? "Mesaj silindi" : m.text.replace(/\n/g, " "))}</div>
        <div class="lsub">${m.from === S.me.id ? "Sen" : esc(ch.name)} · ${fmtShort(m.ts)} ${fmtTime(m.ts)}${findLinks(m.text).length ? " · 🔗" : ""}</div></div>
        <div class="lbtns"><button data-go="${esc(m.id)}" aria-label="Git">↗</button><button data-note="${esc(m.id)}" aria-label="Etiket">🏷️</button><button data-un="${esc(m.id)}" aria-label="Kaldır">✕</button></div></div>`).join("");
    if (ch.pins.length > 1) h += `<div class="row2"><button class="btn sec" id="pins-copy">Hepsini kopyala</button><button class="btn danger" id="pins-clear">Tümünü kaldır</button></div>`;
    $("#sheet .sh-b").innerHTML = h;
    $("#sheet h3").textContent = `📌 Sabitlenenler (${ch.pins.length})`;
  };
  openSheet("📌 Sabitlenenler", "");
  draw();
  $("#sheet").onclick = e => {
    const t = e.target.closest("button,[data-go]"); if (!t) return;
    if (t.dataset.s){ pinSort = t.dataset.s; draw(); }
    else if (t.dataset.f !== undefined && t.closest(".seg")){ pinFilter = t.dataset.f; draw(); }
    else if (t.dataset.go){ closeSheet(); setTimeout(() => jumpTo(t.dataset.go), 120); }
    else if (t.dataset.un){ unpinMsg(ch, t.dataset.un); draw(); }
    else if (t.dataset.note){ const p = ch.pins.find(x => x.id === t.dataset.note); const n = prompt("Sabitleme etiketi:", p.note || ""); if (n !== null){ p.note = n.trim().slice(0, 60); p.ts = now(); save(); syncPins(ch); draw(); renderPinbar(); } }
    else if (t.id === "pins-clear"){ if (confirm(ch.pins.length + " sabitleme kaldırılsın mı?")){ for (const p of [...ch.pins]) unpinLocal(ch, p.id); save(); syncPins(ch); renderAll(); draw(); } }
    else if (t.id === "pins-copy"){ copy(ch.pins.map(p => { const m = ch.messages.find(x => x.id === p.id); return (p.note ? "[" + p.note + "] " : "") + (m ? m.text : ""); }).join("\n\n"), "Sabitlenenler kopyalandı"); }
  };
}

/* ---------- Linkler paneli ---------- */
let linkQ = "", linkWho = "all";
function openLinks(){
  const ch = S.chats[cur];
  const all = []; for (const m of ch.messages) if (!m.deleted) for (const u of new Set(findLinks(m.text))) all.push({u, m});
  const draw = () => {
    let list = all.slice().reverse();
    if (linkWho !== "all") list = list.filter(x => (linkWho === "me") === (x.m.from === S.me.id));
    if (linkQ) list = list.filter(x => x.u.toLowerCase().includes(linkQ) || x.m.text.toLowerCase().includes(linkQ));
    let h = `<input class="field" id="lk-q" placeholder="Linklerde ara (ör. youtube)" value="${esc(linkQ)}">
      <div class="seg"><button data-w="all" class="${linkWho === "all" ? "sel" : ""}">Tümü (${all.length})</button><button data-w="me" class="${linkWho === "me" ? "sel" : ""}">Benim</button><button data-w="ot" class="${linkWho === "ot" ? "sel" : ""}">${esc(ch.name)}</button></div>`;
    if (!list.length) h += `<div class="empty">${all.length ? "Eşleşen link yok." : "Bu sohbette henüz link paylaşılmadı.<br>Alttaki 🔗 düğmesiyle hızlıca link paylaşabilirsin."}</div>`;
    h += list.map(({u, m}) => `<div class="li"><img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(domainOf(u))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="lt"><div style="font-weight:700">${esc(domainOf(u))}${isPinned(ch, m.id) ? ' <span class="pinico">📌</span>' : ""}</div><div class="lsub" style="word-break:break-all">${esc(u)}</div>
      <div class="lsub">${m.from === S.me.id ? "Sen" : esc(ch.name)} · ${fmtShort(m.ts)}</div></div>
      <div class="lbtns"><button data-open="${esc(u)}" aria-label="Aç">🌐</button><button data-cp="${esc(u)}" aria-label="Kopyala">📋</button><button data-pin="${esc(m.id)}" aria-label="Sabitle">📌</button><button data-go="${esc(m.id)}" aria-label="Mesaja git">↗</button></div></div>`).join("");
    $("#sheet .sh-b").innerHTML = h;
    const q = $("#lk-q"); q.oninput = () => { linkQ = q.value.toLowerCase(); const pos = q.selectionStart; draw(); const q2 = $("#lk-q"); q2.focus(); q2.setSelectionRange(pos, pos); };
  };
  openSheet(`🔗 Paylaşılan linkler`, ""); draw();
  $("#sheet").onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.w){ linkWho = t.dataset.w; draw(); }
    else if (t.dataset.open) openExt(t.dataset.open);
    else if (t.dataset.cp) copy(t.dataset.cp, "Link kopyalandı");
    else if (t.dataset.pin){ isPinned(ch, t.dataset.pin) ? unpinMsg(ch, t.dataset.pin) : pinMsg(ch, t.dataset.pin); draw(); }
    else if (t.dataset.go){ closeSheet(); setTimeout(() => jumpTo(t.dataset.go), 120); }
  };
}

function download(name, data, type){

}

async function onSettingChange(k, v, inp){
  const s = S.settings;
  if (k === "lock"){
    if (v){
      const p1 = prompt("4 haneli PIN belirle:"); if (!p1 || !/^\d{4}$/.test(p1)){ inp.checked = false; toast("PIN 4 rakam olmalı"); return; }
      const p2 = prompt("PIN'i tekrar gir:"); if (p1 !== p2){ inp.checked = false; toast("PIN'ler eşleşmedi"); return; }
      const salt = crypto.getRandomValues(new Uint8Array(16)); S._salt = b64(salt); pinKey = await pinDerive(p1, salt);
      toast("Kilit açıldı. PIN'i unutursan veriler açılamaz!", 4000);
    } else { pinKey = null; delete S._salt; toast("Uygulama kilidi kapatıldı"); }
  }
  if (k === "e2ee" && !v && !confirm("Şifrelemeyi kapatırsan mesajlar yolda şifresiz gider. Emin misin?")){ inp.checked = true; return; }
  if (k === "notify" && v){
    if (!("Notification" in window)){ inp.checked = false; toast("Bu cihaz bildirimi desteklemiyor"); return; }
    const p = await Notification.requestPermission(); if (p !== "granted"){ inp.checked = false; toast("Bildirim izni verilmedi"); return; }
  }
  if (k === "demo"){ if (v){ createDemo(); toast("Deneme sohbeti eklendi"); } else if (S.chats[DEMO_ID]){ delete S.chats[DEMO_ID]; toast("Deneme sohbeti kaldırıldı"); } renderList(); }
  if (k === "screenshot" && v && !window.Capacitor) toast("Bu özellik sadece APK sürümünde çalışır");
  s[k] = v; save();
  if (k === "screenshot") applyScreenshot();
  if (k === "presence") for (const pid in conns) rawSend(pid, {t:"hello", name:S.me.name, color:S.me.color, v:VERSION, pub:S.keys.pub, presence:s.presence});
}
function applyScreenshot(){
  try { const P = window.Capacitor?.Plugins?.PrivacyScreen; if (P) S.settings.screenshot ? P.enable() : P.disable(); } catch(e){}
}

/* ================= OLAYLAR ================= */
$("#chat-list").addEventListener("click", e => { const it = e.target.closest("[data-open]"); if (it) openChat(it.dataset.open); });
$("#chat-list").addEventListener("contextmenu", e => {
  const it = e.target.closest("[data-open]"); if (!it) return; e.preventDefault();
  const ch = S.chats[it.dataset.open]; ch.pinnedChat = ch.pinnedChat ? 0 : now(); save(); renderList(); toast(ch.pinnedChat ? "📌 Sohbet en üste sabitlendi" : "Sohbet sabitlemesi kaldırıldı");
});
$("#btn-new").onclick = openInvite;
$("#btn-settings").onclick = openSettings;
$("#set-back").onclick = () => history.back();
$("#chat-back").onclick = () => history.back();
$("#btn-pins").onclick = openPins;
$("#btn-links").onclick = openLinks;
$("#btn-more").onclick = openChatMenu;
$("#btn-attachlink").onclick = openShareLink;
$("#shade").onclick = () => closeSheet();
$("#sheet").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); }, true);
$("#pinbar").addEventListener("click", e => {
  if (e.target.closest("#pinbar-all")){ openPins(); return; }
  const ch = S.chats[cur]; if (!ch.pins.length) return;
  const p = ch.pins[ch.pins.length - 1 - pinIdx]; jumpTo(p.id);
  pinIdx = (pinIdx + 1) % ch.pins.length; renderPinbar();
});
$("#msgs").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const rq = e.target.closest("[data-jump]"); if (rq){ jumpTo(rq.dataset.jump); return; }
  const m = e.target.closest(".m"); if (m) openMsgActions(m.dataset.mid);
});
$("#replyprev").addEventListener("click", e => { if (e.target.closest("#reply-x")) setReply(null); });
function autosize(){ const t = $("#inp"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
let typingSent = 0, typingStop = null;
$("#inp").addEventListener("input", () => {
  autosize();
  if (!cur || !S.settings.typing) return;
  if (now() - typingSent > 3000){ typingSent = now(); send(cur, {t:"typing", on:true}); }
  clearTimeout(typingStop); typingStop = setTimeout(() => { typingSent = 0; if (cur) send(cur, {t:"typing", on:false}); }, 2500);
});
$("#inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && S.settings.enterSend){ e.preventDefault(); doSend(); }
});
function doSend(){ const t = $("#inp"); const v = t.value; t.value = ""; autosize(); typingSent = 0; if (cur) send(cur, {t:"typing", on:false}); sendText(v); t.focus(); }
$("#btn-send").addEventListener("click", doSend);
$("#set-body").addEventListener("change", e => {
  const k = e.target.dataset.k; if (k){ onSettingChange(k, e.target.checked, e.target); return; }
  const sel = e.target.dataset.sel; if (sel){ S.settings[sel] = e.target.value; save(); applyTheme(); }
  if (e.target.id === "restore-file" && e.target.files[0]){
    const r = new FileReader(); r.onload = () => {
      try { const d = JSON.parse(r.result); if (!d.me || !d.keys) throw 0; if (!confirm("Mevcut veriler bu yedekle değiştirilecek. Devam?")) return; S = d; S.settings.lock = false; pinKey = null; saveNow().then(() => location.reload()); }
      catch(err){ toast("Geçersiz yedek dosyası"); }
    }; r.readAsText(e.target.files[0]);
  }
});
$("#set-body").addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (c){ S.me.color = c.dataset.c; save(); renderSettings(); for (const pid in conns) rawSend(pid, {t:"hello", name:S.me.name, color:S.me.color, v:VERSION, pub:S.keys.pub, presence:S.settings.presence}); return; }
  const x = e.target.closest("[data-x]")?.dataset.x; if (!x) return;
  if (x === "name"){ const n = prompt("Adın:", S.me.name); if (n && n.trim()){ S.me.name = n.trim().slice(0, 30); save(); renderSettings(); for (const pid in conns) rawSend(pid, {t:"hello", name:S.me.name, color:S.me.color, v:VERSION, pub:S.keys.pub, presence:S.settings.presence}); } }
  if (x === "backup"){ if (confirm("Yedek dosyası gizli anahtarını içerir. Kimseyle paylaşma. Devam?")){ const d = JSON.parse(JSON.stringify(S)); delete d._salt; d.settings.lock = false; download(`TalkTime_yedek_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(d), "application/json"); } }
  if (x === "restore") $("#restore-file").click();
  if (x === "wipe" && confirm("Tüm sohbetler, anahtarın ve ayarların silinecek. Emin misin?")){ localStorage.removeItem(LS); location.href = location.pathname; }
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){ if (cur){ markRead(cur); renderAll(); } if (peer && peer.disconnected && !peer.destroyed) try { peer.reconnect(); } catch(e){} reconnectAll(); }
});
window.addEventListener("online", () => { if (peer?.disconnected) try { peer.reconnect(); } catch(e){} reconnectAll(); });
window.addEventListener("beforeunload", () => { if (cur){ const ch = S.chats[cur]; if (ch) ch.draft = $("#inp").value; } saveNow(); });
window.openInvite = openInvite; window.openCodeJoin = openCodeJoin;

history.replaceState({v:"root"}, "");
boot();
</script>
