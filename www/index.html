:root{--navy:#0b1f5c;--blue:#1d4ed8;--blue2:#2563eb;--sky:#38bdf8;--pink:#ec4899;--orange:#f97316;--gold:#facc15;--bg:#f4f7ff;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#16a34a;--bad:#dc2626;--fs:1}
body.dark{--bg:#070f2b;--card:#101c47;--text:#eef2ff;--muted:#9aa8d6;--line:#1f2d63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,sans-serif;font-weight:700;background:var(--bg);color:var(--text);font-size:calc(16px*var(--fs));min-height:100vh;overscroll-behavior:none}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.hidden{display:none!important}
/* ---- Logo / wordmark (Diksiyon Koçu stili) ---- */
.wm{font-family:"Baloo",sans-serif;font-weight:800;letter-spacing:.5px;line-height:.9;display:inline-flex;transform:skewX(-8deg)}
.wm .a{color:#fff;padding:0 .02em;filter:drop-shadow(2px 0 0 #0b1f5c) drop-shadow(-2px 0 0 #0b1f5c) drop-shadow(0 2px 0 #0b1f5c) drop-shadow(0 -2px 0 #0b1f5c) drop-shadow(0 4px 0 #0b1f5c) drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.wm .b{background:linear-gradient(90deg,#ff2d95 0%,#ff6a2b 50%,#ffd21f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0 .08em 0 .02em;filter:drop-shadow(2px 0 0 #0b1f5c) drop-shadow(-2px 0 0 #0b1f5c) drop-shadow(0 2px 0 #0b1f5c) drop-shadow(0 -2px 0 #0b1f5c) drop-shadow(0 4px 0 #0b1f5c) drop-shadow(0 8px 12px rgba(255,90,40,.5))}
.swoosh{display:block;margin:-6px auto 0;width:86%}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:2px;color:#fff;background:linear-gradient(#0b1f5c,#0b1f5c) padding-box,linear-gradient(90deg,#38bdf8,#ec4899,#facc15) border-box;border:2px solid transparent}
/* ---- Splash ---- */
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2563eb 0%,#0b1f5c 55%,#050b24 100%);transition:opacity .5s}
#splash img{width:84vw;max-width:400px;border-radius:12%;box-shadow:0 0 0 6px rgba(56,189,248,.25),0 0 60px 10px rgba(56,189,248,.55);animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
#splash .wm{font-size:54px;margin-top:26px}
#splash .slog{color:#bfdbfe;margin-top:14px;letter-spacing:1px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* ---- Hero header ---- */
.hero{position:relative;padding:18px 16px 14px;color:#fff;text-align:center;background:radial-gradient(circle at 50% 0%,#3b82f6 0%,#1d4ed8 40%,#0b1f5c 100%);border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 10px 30px rgba(11,31,92,.35)}
.hero:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(56,189,248,.25),transparent 30%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero>*{position:relative}
.hero-row{display:flex;align-items:center;gap:14px;justify-content:center}
.hero-logo{width:84px;height:84px;border-radius:22%;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 28px 6px rgba(56,189,248,.7);animation:glow 2.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 40px 12px rgba(250,204,21,.55)}}
.hero .wm{font-size:46px}
.hero .sub{font-size:11px;letter-spacing:3px;color:#bfdbfe;margin-top:4px}
.stats{display:flex;justify-content:space-around;margin-top:12px;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 4px;backdrop-filter:blur(4px)}
.stats div{font-size:13px}.stats b{display:block;font-size:18px}
/* ---- Cards & buttons ---- */
.wrap{padding:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,23,42,.07);border:1px solid var(--line)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:calc(17px*var(--fs));color:#fff;background:linear-gradient(90deg,#1d4ed8,#2563eb);box-shadow:0 5px 0 #0b1f5c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1f5c}
.btn.gold{background:linear-gradient(90deg,#ff2d95,#ff6a2b,#ffb703);box-shadow:0 5px 0 #9a3412}
.btn.ghost{background:transparent;color:var(--blue2);box-shadow:none;border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #14532d}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #7f1d1d}
.btn:disabled{opacity:.45}
h2{font-family:"Baloo",sans-serif;font-weight:800;margin:6px 0 10px;font-size:calc(24px*var(--fs))}
h3{margin:4px 0 8px}
.muted{color:var(--muted);font-size:.9em}
/* ---- Lesson ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.x{background:none;font-size:26px;color:var(--muted)}
.prog{flex:1;height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:9px;transition:width .3s}
.qtitle{font-size:calc(19px*var(--fs));font-weight:800;margin:8px 0 14px}
.big{font-size:calc(40px*var(--fs));font-family:"Baloo";font-weight:800;text-align:center;margin:6px 0}
.emoji{font-size:calc(84px*var(--fs));text-align:center;line-height:1.1}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{padding:16px 12px;border-radius:16px;background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:calc(17px*var(--fs));text-align:center}
.opt.pic{font-size:calc(52px*var(--fs));padding:10px}
.opt.sel{border-color:var(--blue2);box-shadow:0 4px 0 var(--blue2);background:#eff6ff}
body.dark .opt.sel{background:#1b2d72}
.opt.right{border-color:var(--ok);background:#dcfce7;color:#14532d;box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fee2e2;color:#7f1d1d;box-shadow:0 4px 0 var(--bad)}
.spk{background:linear-gradient(135deg,#38bdf8,#1d4ed8);color:#fff;border-radius:18px;font-size:30px;width:74px;height:74px;box-shadow:0 5px 0 #0b1f5c}
.spk.sm{width:44px;height:44px;font-size:20px;border-radius:12px;box-shadow:0 3px 0 #0b1f5c}
.center{text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:54px;padding:8px;border-radius:14px}
.tiles.ans{border-bottom:2px dashed var(--line);margin-bottom:10px}
.tile{padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:calc(17px*var(--fs));color:var(--text)}
.inp{width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);font-size:calc(20px*var(--fs));font-family:inherit;font-weight:800;background:var(--card);color:var(--text);text-align:center}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:16px 16px 22px;z-index:20;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;animation:up .2s}
.feedback.ok{background:#dcfce7;color:#14532d}.feedback.bad{background:#fee2e2;color:#7f1d1d}
body.dark .feedback.ok{background:#0f3d24;color:#bbf7d0}body.dark .feedback.bad{background:#4a1111;color:#fecaca}
@keyframes up{from{transform:translateY(100%)}}
.footer-act{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:12px 16px 20px;background:var(--bg)}
.mascot{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:18px;margin-bottom:12px}
.mascot img{width:56px;height:56px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid #facc15;background:#1d4ed8}
.bubble{flex:1;font-size:.95em}
.timer{height:6px;border-radius:4px;background:linear-gradient(90deg,#f97316,#facc15);transition:width linear}
/* ---- Nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 10px;z-index:10}
nav button{flex:1;background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:24px}
nav button.on{color:var(--blue2)}
/* ---- Misc ---- */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{display:none}
.sw i{position:absolute;inset:0;border-radius:20px;background:#cbd5e1;transition:.2s}
.sw i:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:linear-gradient(90deg,#1d4ed8,#38bdf8)}
.sw input:checked+i:after{left:25px}
select{padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-weight:800}
.agegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.age{padding:14px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:center;color:var(--text)}
.age b{display:block;font-size:30px}
.age.sel{border-color:var(--blue2);background:#eff6ff}
body.dark .age.sel{background:#1b2d72}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;font-size:11px;padding:8px 2px;border-radius:14px;background:var(--bg)}
.badge b{display:block;font-size:30px}
.badge.off{filter:grayscale(1);opacity:.4}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;color:#fff;background:var(--blue2)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;color:var(--text);text-align:left;font-size:1em}
.list-item .ic{font-size:30px}
.word{cursor:pointer;border-bottom:2px dotted var(--sky)}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#0b1f5c;color:#fff;padding:8px 14px;border-radius:12px;z-index:30;font-size:14px}
.credit{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 4px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.lockscreen{position:fixed;inset:0;z-index:80;background:radial-gradient(circle,#1d4ed8,#0b1f5c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.flash{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px}

/* ===== v1.1 ===== */
.trh{display:block;font-size:.82em;font-weight:700;color:#7c3aed;opacity:.85;margin-top:2px}
body.dark .trh{color:#c4b5fd}
.sub.dark{color:#475569;letter-spacing:2px;font-size:11px}
.cover img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(11,31,92,.35)}
.choice{display:block;width:100%;text-align:left;padding:16px;border-radius:18px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;margin-bottom:10px;color:var(--text);font-size:1em}
.choice b{display:block;font-size:1.05em}.choice span{color:var(--muted);font-weight:700}
.choice.sel{border-color:#2563eb;background:#eff6ff}body.dark .choice.sel{background:#1b2d72}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.avbtn{aspect-ratio:1;border-radius:50%;font-size:26px;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.avbtn.sel{border-color:#facc15;transform:scale(1.08);box-shadow:0 0 0 3px #0b1f5c}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.av img{width:100%;height:100%;object-fit:cover}
.hero-row .av{margin-left:auto}
/* --- World map --- */
.wmap{margin:14px 0 0}
.wmap .world{margin:0 14px 0;position:relative;z-index:3}
.world{border-radius:20px;padding:12px 14px;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(11,31,92,.25)}
.world .wi{font-size:32px}.world small{opacity:.9}
.scene{position:relative;margin-top:-18px;padding-top:18px;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,color-mix(in srgb,var(--w) 22%,#fff) 100%)}
body.dark .scene{background:linear-gradient(180deg,#0f1b4d,#0b1238 70%,color-mix(in srgb,var(--w) 30%,#070f2b))}
.silh{position:absolute;left:0;bottom:0;width:100%;height:140px;fill:color-mix(in srgb,var(--w) 30%,transparent);pointer-events:none}
.silh.s2{top:40%;bottom:auto;height:110px;opacity:.5;transform:scaleX(-1)}
.deco{position:absolute;font-size:34px;opacity:.55;filter:saturate(.9);pointer-events:none}
.road{position:absolute;left:50%;top:18px;transform:translateX(-50%);overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.nodes{position:absolute;left:50%;top:18px;transform:translateX(-50%);height:100%}
.nwrap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:150px;z-index:2}
.node{width:80px;height:80px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--nc) 55%,#fff),var(--nc) 70%);box-shadow:0 7px 0 color-mix(in srgb,var(--nc) 60%,#000),0 10px 18px rgba(0,0,0,.25);border:4px solid #fff}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 color-mix(in srgb,var(--nc) 60%,#000)}
.nicon{font-size:36px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.nflag{position:absolute;top:-10px;left:-8px;font-size:22px;background:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.nlock{position:absolute;right:-6px;bottom:-4px;font-size:15px;background:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.node.lock{filter:saturate(.75) brightness(1.08);opacity:.88}
.node.lock .nicon{opacity:.7}
.node.boss{width:96px;height:96px;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b301 65%);box-shadow:0 7px 0 #a16207,0 10px 22px rgba(245,179,1,.5)}
.node.cur{animation:bob 1.4s ease-in-out infinite;box-shadow:0 7px 0 color-mix(in srgb,var(--nc) 60%,#000),0 0 0 7px rgba(250,204,21,.55),0 0 28px 8px rgba(250,204,21,.6)}
@keyframes bob{50%{transform:translateY(-7px)}}
.nstars{position:absolute;top:-30px;font-size:17px;letter-spacing:-2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.nlabel{margin-top:10px;text-align:center;background:rgba(255,255,255,.88);padding:3px 10px;border-radius:12px;line-height:1.15;box-shadow:0 2px 6px rgba(0,0,0,.1)}
body.dark .nlabel{background:rgba(16,28,71,.9)}
.nlabel b{font-size:13px;display:block;white-space:nowrap;color:#0b1f5c}body.dark .nlabel b{color:#fff}
.nlabel small{font-size:11px;color:#64748b;font-weight:700}
.leo{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:1;pointer-events:none}
.leo img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #facc15;background:#1d4ed8;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.leo span{margin-top:4px;background:#0b1f5c;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;white-space:nowrap}
.intro .bigflag{font-size:54px;line-height:1}
/* --- Lesson --- */
body.inlesson{background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--wc) 38%,#fff) 0%,color-mix(in srgb,var(--wc) 12%,#f4f7ff) 45%,#f4f7ff 100%) fixed}
body.inlesson:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--wc) 22%,transparent) 1.5px,transparent 1.6px);background-size:22px 22px;opacity:.6;z-index:-1}
body.dark.inlesson{background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--wc) 40%,#070f2b),#070f2b 60%) fixed}
.topbar{background:transparent;backdrop-filter:blur(6px)}
.prog{position:relative;flex:1;height:16px;border-radius:10px;background:rgba(148,163,184,.35);overflow:visible}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .35s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.leocur{position:absolute;top:-8px;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #facc15;transition:left .35s;background:#1d4ed8}
.pc{font-weight:800;color:#f97316;min-width:38px;text-align:right}
.chip{display:inline-block;background:var(--cc);color:#fff;font-size:12px;font-weight:800;letter-spacing:1.5px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 60%,#000)}
.qtitle{font-size:calc(21px*var(--fs));font-weight:800;margin:10px 0 12px;font-family:"Baloo",sans-serif}
.qcard{background:var(--card);border:3px solid color-mix(in srgb,var(--cc,#2563eb) 55%,#fff);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--cc,#2563eb) 35%,#fff),0 10px 24px rgba(15,23,42,.08);text-align:center}
body.dark .qcard{border-color:color-mix(in srgb,var(--cc,#2563eb) 55%,#000);box-shadow:0 6px 0 color-mix(in srgb,var(--cc,#2563eb) 35%,#000)}
.qrow{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.qem{font-size:calc(46px*var(--fs))}
.qtext{font-size:calc(24px*var(--fs));font-weight:800;font-family:"Baloo",sans-serif;line-height:1.25}
.big{font-size:calc(40px*var(--fs));font-family:"Baloo",sans-serif;font-weight:800;text-align:center;margin:4px 0;line-height:1.1}
.trbig{color:#7c3aed;font-size:1.25em;font-weight:800}
.opts{display:grid;gap:12px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{padding:16px 12px;border-radius:18px;background:var(--card);color:var(--text);border:3px solid #cbd5e1;border-bottom-width:6px;font-size:calc(18px*var(--fs));font-weight:800;text-align:center;transition:transform .06s}
body.dark .opt{border-color:#2a3a7a}
.opt:active{transform:translateY(3px);border-bottom-width:3px}
.opt.pic{font-size:calc(56px*var(--fs));padding:10px}
.opt.right{border-color:#16a34a;background:#bbf7d0;color:#14532d;box-shadow:0 0 18px 2px rgba(34,197,94,.55);animation:pulse .5s}
.opt.wrong,.tiles.wrong,.inp.wrong{border-color:#f87171!important;background:#ffe4e6!important;color:#9f1239}
.inp.right,.tiles.right{border-color:#16a34a!important;background:#dcfce7!important}
@keyframes pulse{50%{transform:scale(1.04)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ghostbtn{display:block;margin:14px auto 0;background:none;color:var(--muted);font-size:15px;padding:10px 16px;border-radius:12px}
.ghostbtn:active{background:rgba(148,163,184,.2)}
.mini-fb{margin-top:12px;padding:12px;border-radius:14px;text-align:center;font-weight:800}
.mini-fb.ok{background:#dcfce7;color:#14532d}.mini-fb.bad{background:#ffe4e6;color:#9f1239}
.tile{padding:10px 14px;border-radius:12px;background:var(--card);border:3px solid #cbd5e1;border-bottom-width:5px;font-size:calc(18px*var(--fs));font-weight:800;color:var(--text)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:8px;border-radius:16px}
.tiles.ans{border:2px dashed #94a3b8;margin-bottom:12px;background:rgba(255,255,255,.5)}
.inp{border:3px solid #cbd5e1;border-bottom-width:5px;font-weight:800}
.spk{background:linear-gradient(135deg,#38bdf8,#1d4ed8);color:#fff;border-radius:18px;font-size:28px;width:70px;height:70px;box-shadow:0 5px 0 #0b1f5c}
.spk.sm{width:46px;height:46px;font-size:20px;border-radius:14px;box-shadow:0 4px 0 #0b1f5c}
.spk.xl{width:110px;height:110px;font-size:46px;border-radius:30px}
.spk.mic{width:110px;height:110px;font-size:46px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#ef4444);box-shadow:0 6px 0 #7f1d1d}
.spk.mic.live{animation:pulse 1s infinite;background:linear-gradient(135deg,#22c55e,#16a34a)}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 18px 24px;z-index:20;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;animation:up .2s;box-shadow:0 -8px 24px rgba(0,0,0,.15)}
.feedback h3{font-family:"Baloo",sans-serif;font-size:1.5em;margin:0 0 6px}
.feedback.ok{background:#dcfce7;color:#14532d}.feedback.bad{background:#ffe4e6;color:#9f1239}
.fbx{margin-top:6px;font-size:.92em;opacity:.9}
.footer-act{background:transparent}
.flash .emoji{font-size:calc(90px*var(--fs))}
/* --- Result --- */
.result{padding-top:26px}
.resleo img{width:130px;height:130px;border-radius:50%;object-fit:cover;object-position:top;border:5px solid #facc15;background:#1d4ed8;box-shadow:0 0 0 6px rgba(250,204,21,.3),0 0 40px rgba(250,204,21,.6);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.bigpraise{font-family:"Baloo",sans-serif;font-size:calc(42px*var(--fs));margin:12px 0 0;background:linear-gradient(90deg,#ff2d95,#ff6a2b,#f5b301);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.resstars{font-size:44px;margin:6px 0 10px}.resstars span{filter:grayscale(1);opacity:.3}
.btn.share{background:linear-gradient(90deg,#22c55e,#16a34a);box-shadow:0 5px 0 #14532d}
.btn.sp{background:#1db954;box-shadow:0 5px 0 #0f6b2f}.btn.yt{background:#ff0033;box-shadow:0 5px 0 #8a001b}
/* --- League --- */
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;margin:10px 0 12px}
.seg button{flex:1;padding:10px;border-radius:10px;background:none;color:var(--muted)}
.seg button.on{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff}
.lrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 12px;margin-bottom:10px}
.lrow.me{border-color:#facc15;background:linear-gradient(90deg,#fffbeb,var(--card))}body.dark .lrow.me{background:#2a2a10}
.rk{font-size:24px;width:30px;text-align:center;font-weight:800}.lv{color:#f97316;white-space:nowrap}
/* --- Bars --- */
.bars{display:flex;gap:6px;align-items:flex-end;height:80px;margin:10px 0}
.bars div{flex:1;text-align:center;font-size:11px}.bars i{display:block;background:linear-gradient(#38bdf8,#1d4ed8);border-radius:6px}
.bars.gold i{background:linear-gradient(#facc15,#f97316)}
/* --- Music --- */
.mfab{position:fixed;right:max(14px,calc(50% - 266px));bottom:92px;width:54px;height:54px;border-radius:50%;font-size:26px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;box-shadow:0 5px 0 #6b21a8,0 8px 20px rgba(139,92,246,.45);z-index:15}
.mfab.on{animation:pulse 1.4s infinite}
.sheet{position:fixed;inset:0;background:rgba(5,11,36,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 16px 26px;animation:up .2s;max-height:88vh;overflow:auto}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mood{padding:14px;border-radius:16px;background:var(--bg);border:3px solid var(--line);border-bottom-width:5px;font-size:26px;color:var(--text)}
.mood b{display:block;font-size:14px}.mood.on{border-color:#8b5cf6;background:#f5f3ff}body.dark .mood.on{background:#2e1065}
input[type=range]{width:55%;accent-color:#8b5cf6}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.lockscreen img{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:top;border:5px solid #facc15}
.mascot img{object-fit:cover;object-position:top}

.hero-act{margin-left:auto;display:flex;align-items:center;gap:8px}
.hshare{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:18px;box-shadow:0 3px 0 #14532d}
.hero-row .av{margin-left:0}

.sharepill{display:block;margin:12px auto 0;padding:9px 18px;border-radius:999px;background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;font-size:14px;box-shadow:0 4px 0 #14532d;position:relative}
.sharepill.light{margin:14px auto 0}
.postcard{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;border:3px solid color-mix(in srgb,var(--w) 45%,#fff);box-shadow:0 6px 0 color-mix(in srgb,var(--w) 30%,#fff),0 10px 24px rgba(0,0,0,.08);background-image:repeating-linear-gradient(45deg,transparent 0 10px,color-mix(in srgb,var(--w) 6%,transparent) 10px 20px)}
.pc-top{display:flex;align-items:center;gap:12px}.pc-top h2{margin:0}
.pc-top .bigflag{font-size:52px;line-height:1}
.pc-sub{color:var(--muted);font-weight:800}
.capb{color:#ca8a04}
.pc-stamp{margin-left:auto;font-size:30px;transform:rotate(-12deg)}
.pc-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.pc-row>span{font-size:22px}
.pc-fact{margin-top:10px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--w) 10%,var(--card))}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match>div{display:grid;gap:10px}
.msnd{background:linear-gradient(135deg,#ccfbf1,#99f6e4);border-color:#14b8a6}
body.dark .msnd{background:#134e4a}
.opt.sel{border-color:#2563eb;background:#dbeafe}
.passport{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:300px;overflow:auto;margin-top:8px}
.stamp{text-align:center;font-size:9px;padding:6px 2px;border-radius:10px;border:2px dashed var(--line);color:var(--muted);filter:grayscale(1);opacity:.5;line-height:1.2}
.stamp b{display:block;font-size:22px}
.stamp.on{filter:none;opacity:1;border-color:#16a34a;color:var(--text);background:#f0fdf4;transform:rotate(-3deg)}
body.dark .stamp.on{background:#0f3d24}
.choice .tag{background:#22c55e!important;color:#fff!important}
/* ===== v2.0 ===== */
.topbar .prog{flex:1}
.obleo{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.obleo img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #facc15;box-shadow:0 4px 0 #ca8a04}
.obleo .bub{background:var(--card);border-radius:18px 18px 18px 6px;padding:12px 14px;box-shadow:0 4px 14px rgba(15,23,42,.08);font-size:1.05em;max-width:92%}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ib{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 4px;font-weight:800;font-size:13px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px}
.ib span{font-size:34px}
.ib.sel{border-color:#2563eb;background:#dbeafe;box-shadow:0 4px 0 #1d4ed8}
body.dark .ib.sel{background:#1e3a8a}
.okline{color:#16a34a;font-weight:800;margin:6px 0}
.proj{width:100%;height:auto;margin-top:6px}.proj .pl{font:800 16px Nunito,sans-serif;fill:var(--text)}
.projx{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}
.timepick{font:800 44px Baloo,sans-serif;border:3px solid #2563eb;border-radius:20px;padding:10px 18px;color:#1d4ed8;background:var(--card)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:10px 0}
.qk{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);box-shadow:0 4px 0 var(--line)}
.qk span{font-size:28px}.qk b{font-size:14px}.qk small{color:var(--muted);font-size:11px;text-align:center;line-height:1.2}
.toks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:10px 12px;font-weight:800;font-size:1.1em;color:var(--text)}
.tok.right{border-color:#16a34a;background:#dcfce7}.tok.wrong{border-color:#ef4444;background:#fee2e2}
.chatbox{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.rolebar{background:#fef3c7;color:#92400e;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
body.dark .rolebar{background:#422006;color:#fde68a}
.cb{display:flex;gap:8px;align-items:flex-end}
.cb img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #facc15;flex:none}
.cb .cbody{padding:12px 14px;border-radius:20px;font-weight:700;font-size:1.05em;max-width:82%}
.cb.cleo .cbody{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-bottom-left-radius:6px}
.cb.cyou{justify-content:flex-end}.cb.cyou .cbody{background:var(--card);border:2px solid var(--line);border-bottom-right-radius:6px}
.cb.cyou.ok .cbody{border-color:#16a34a}.cb.cyou.bad .cbody{border-color:#f97316}
.who{font-size:11px;letter-spacing:1px;opacity:.8;margin-bottom:2px}
.ctr{margin-top:6px;font-size:.9em;color:#fde68a}

function fxCanvas() { const c = document.createElement("canvas"); c.className = "fx"; document.body.appendChild(c); c.width = innerWidth; c.height = innerHeight; return c; }
const COLS = ["#ff2d95", "#ff6a2b", "#ffd21f", "#38bdf8", "#22c55e", "#a855f7", "#ffffff"];
const fxOn = () => !(DB.active && P() && !S().confetti);
function confetti() {
  if (!fxOn()) return;

  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 6, c: COLS[Math.random() * 6 | 0], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6 }));
  let f = 0; (function tick() { x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); }); if (++f < 160) requestAnimationFrame(tick); else c.remove(); })();
}
function fireworks(bursts = 6) {
  if (!fxOn()) return;

  const boom = () => { const cx = c.width * (.15 + Math.random() * .7), cy = c.height * (.12 + Math.random() * .4), col = COLS[Math.random() * 7 | 0];
    for (let i = 0; i < 70; i++) { const a = Math.PI * 2 * i / 70, s = 2 + Math.random() * 4; ps.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 60 + Math.random() * 30, c: col }); } beep("boom"); };
  for (let i = 0; i < bursts; i++) setTimeout(boom, i * 380);
  let f = 0; (function tick() { x.globalCompositeOperation = "destination-out"; x.fillStyle = "rgba(0,0,0,0.18)"; x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = "lighter";

    if (++f < 60 * (bursts * .4 + 2.2)) requestAnimationFrame(tick); else c.remove(); })();
}

function levelWords(n) {
  if (!isBoss(n)) return TOPICS[topicIdx(n)].w.map(W);
  let all = []; for (let i = 0; i < 9; i++) all = all.concat(TOPICS[(worldOf(n) - 1) * 9 + i].w.map(W)); return all;
}
const ALLWORDS = TOPICS.flatMap(t => t.w.map(W));
let NEAR = ALLWORDS;

// ---------- Alıştırma üretici ----------
function distractors(word, pool, key, n = 3) {
  const seen = new Set([word[key], word.em, word.en, word.tr]);
  return shuffle(pool).concat(shuffle(NEAR), shuffle(ALLWORDS)).filter(w => { if (seen.has(w[key]) || (key !== "tr" && seen.has(w.em))) return false; seen.add(w[key]); seen.add(w.em); return true; }).slice(0, n);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || (NSR ? "native" : null);
function makeQuestions(n) {
  const cfg = ageCfg(), st = S();
  NEAR = TOPICS.slice(0, Math.min(72, worldOf(n) * 9)).flatMap(t => t.w.map(W));
  const words = levelWords(n);
  let types = cfg.types.slice();
  if (isBoss(n) && !cfg.kid) types = ["listen", "meaningTR", "grammar", "fixit", "meaningEN", "build", "speak", "dictate", "spell"];
  if (!st.dictation) types = types.filter(t => t !== "fixit" && t !== "dictate");
  if (!cfg.typing || !st.typing) types = types.map(t => t === "dictate" ? "build" : t);
  if (!st.speak || !SR) types = types.filter(t => t !== "speak");
  if (!st.typing) types = types.map(t => t === "spell" ? "letters" : t);
  if (P().age === "mini") types = types.filter(t => t !== "letters");
  const gram = [];
  const gIdxs = isBoss(n) ? [0, 1, 2].map(i => (worldOf(n) - 1) * 3 + i) : [grammarIdx(n)];
  if (cfg.grammar) gIdxs.forEach(gi => GRAMMAR[gi].q.forEach(q => gram.push({ gi, q })));
  const GT = ["grammar", "build", "fixit", "dictate"];
  if (!gram.length) types = types.filter(t => !GT.includes(t));
  const count = cfg.q + (isBoss(n) ? 4 : 0); const qs = []; const wq = shuffle(words), gq = shuffle(gram); let wi = 0, gi = 0;
  for (let i = 0; i < count; i++) { const t = types[i % types.length]; if (GT.includes(t)) qs.push({ t, g: gq[gi++ % gq.length] }); else qs.push({ t, w: wq[wi++ % wq.length], pool: words }); }
  return shuffle(qs);
}

function placement() {
  const qs = []; for (let w = 1; w <= 8; w++) pick([0, 1, 2], 2).forEach(i => qs.push({ w, q: pick(GRAMMAR[(w - 1) * 3 + i].q, 1)[0] }));
  let i = 0; const score = {}; hideNav(); musicFab(false);
  const step = () => {
    if (i >= qs.length) {
      let passed = 0; for (let w = 1; w <= 8; w++) { if ((score[w] || 0) >= 2) passed = w; else break; }
      P().unlocked = Math.max(P().unlocked || 1, Math.min(passed * 10 + 1, TOTAL)); if (!passed && Object.values(score).reduce((x, y) => x + y, 0) < 3) P().starterMode = true; if (!P().stats.lessons) P().start.lvl = P().unlocked; save();
      const c = city(P().unlocked);
      $("#app").innerHTML = `<div class="wrap center" style="padding-top:30px"><div class="emoji">🎯</div><h1 class="bigpraise">${passed ? "Great job!" : "Let's start!"}</h1><h2>${passed ? `You passed ${WORLDS[passed - 1].cefr}` : "Your world tour begins"}</h2>
        <p class="muted">Your journey starts in ${c.flag} ${esc(c.name)}.</p>${tr(passed ? "Bildiğin seviyeler açıldı." : "Yolculuğun İstanbul'dan başlıyor.")}
        <div style="height:14px"></div><button class="btn gold" id="ok">Open the map</button></div>`; fireworks(4); beep("win");
      $("#ok").onclick = () => { tab = "map"; render(); }; return;
    }
    const { w, q } = qs[i]; const [s, a, o] = q;
    $("#app").innerHTML = `<div class="topbar"><div class="prog"><i style="width:${i / qs.length * 100}%"></i></div><span class="pc">${i + 1}/${qs.length}</span></div>
      <div class="wrap"><span class="chip" style="--cc:#2563eb">🧪 PLACEMENT · ${WORLDS[w - 1].cefr}</span><div class="qtitle">Fill in the blank${tr("Boşluğu doldur")}</div><div class="qcard" style="--cc:#2563eb"><div class="qtext">${esc(s)}</div></div>
      <div class="opts">${shuffle(o).map(x => `<button class="opt" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div><button class="ghostbtn" data-v="__">🤷 I don't know</button><div id="pfb"></div></div>`;
    $("#app").querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const ok = b.dataset.v === a; if (ok) score[w] = (score[w] || 0) + 1;
      $("#app").querySelectorAll("[data-v]").forEach(x => { x.disabled = true; if (x.dataset.v === a) x.classList.add("right"); });
      if (!ok && b.dataset.v !== "__") b.classList.add("wrong", "shake");
      beep(ok ? "ok" : "bad");
      $("#pfb").innerHTML = `<div class="mini-fb ${ok ? "ok" : "bad"}">${ok ? `✅ ${PRAISE[Math.random() * PRAISE.length | 0][0]}` : `❌ Correct answer: <b>${esc(a)}</b>`}</div>`;
      setTimeout(() => { i++; step(); }, ok ? 900 : 1600);
    });
  };
  step();
}

function popText(title) { const r = (DB.pop || {})[title]; if (!r) return ""; const v = r.v >= 1e6 ? (r.v / 1e6).toFixed(1).replace(/\.0$/, "") + " million" : Math.round(r.v).toLocaleString("en-US"); return `≈ ${v}${r.y ? ` (${r.y})` : ""}`; }
async function loadPop(title) {
  DB.pop = DB.pop || {}; const r = DB.pop[title];
  if (r && Date.now() - r.t < 30 * 864e5) return;
  try {
    const u = `https://www.wikidata.org/w/api.php?action=wbgetentities&sites=enwiki&titles=${encodeURIComponent(title)}&props=claims&format=json&origin=*`;
    const d = await (await fetch(u)).json(); const ent = Object.values(d.entities || {})[0]; const cl = ent && ent.claims && ent.claims.P1082; if (!cl) throw 0;
    let best = null; cl.forEach(x => { const a = x.mainsnak && x.mainsnak.datavalue && +x.mainsnak.datavalue.value.amount; const tq = x.qualifiers && x.qualifiers.P585 && x.qualifiers.P585[0].datavalue.value.time; const y = tq ? +tq.slice(1, 5) : 0; if (a && (!best || y > best.y || (x.rank === "preferred" && y >= best.y))) best = { v: a, y }; });
    if (!best) throw 0; DB.pop[title] = { v: best.v, y: best.y, t: Date.now() }; save();
  } catch (e) { if (!r) { const el = $("#pop"); if (el) el.textContent = "Connect to the internet to see the latest number"; } return; }
  const el = $("#pop"); if (el) el.textContent = popText(title);
}

const MUSIC = { on: false, mood: "chill", vol: .5, timer: null, step: 0, master: null, duck: false, next: 0 };
const MOODS = {
  focus: { n: "Focus", i: "🧘", bpm: 64, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], pad: true },
  chill: { n: "Chill lo-fi", i: "☕", bpm: 78, prog: [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59], [45, 48, 52, 55]], drums: true, pad: true, keys: true },

  happy: { n: "Happy", i: "😊", bpm: 104, prog: [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48]], drums: true, arp: true, bass: true }

const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(t, f, d, type, vol, cut) { const ctx = AC(); const o = ctx.createOscillator(), g = ctx.createGain(), fl = ctx.createBiquadFilter(); o.type = type; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = cut || 2200; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.08, d * .3)); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(fl); fl.connect(g); g.connect(MUSIC.master); o.start(t); o.stop(t + d + .05); }

function kick(t, vol) { const ctx = AC(); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .18); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.connect(g); g.connect(MUSIC.master); o.start(t); o.stop(t + .3); }
function musicTick() {

  while (t < ctx.currentTime + .3) {
    const st = MUSIC.step % 16, ch = M.prog[Math.floor(MUSIC.step / 16) % 4];
    if (st === 0) { if (M.pad) ch.forEach(n => tone(t, mf(n), s16 * 15, "sawtooth", .028, 900)); if (M.keys) ch.forEach((n, i) => tone(t + i * .025, mf(n + 12), s16 * 6, "triangle", .05, 2400)); }
    if (M.keys && st === 10) ch.forEach(n => tone(t, mf(n + 12), s16 * 4, "triangle", .035, 2000));
    if (M.arp && st % 2 === 0) tone(t, mf(ch[(st / 2) % ch.length] + 24), s16 * 1.6, "square", .022, 3000);

      if (M.four ? st % 4 === 0 : (st === 0 || st === 7 || st === 10)) kick(t, M.four ? .5 : .35);
      if (st % 8 === 4) noise(t, .14, .12, 1800);
      if (st % 2 === 0) noise(t, .03, M.four ? .05 : .03, 8000);

function musicPlay(mood) {

}
function musicStop() { MUSIC.on = false; clearInterval(MUSIC.timer); refreshMusicIcons(); }
function musicDuck(on) { MUSIC.duck = on; if (MUSIC.master) MUSIC.master.gain.value = on ? .03 : MUSIC.vol * .8; }

function validateBackup(t) {

    if (!ok) return null;

async function scheduleReminder(ask) {
  if (!NATIVE || !NLN) { if (ask && !NATIVE) toast("Reminders work in the Android app ⏰"); return; }
  try {
    await NLN.cancel({ notifications: [{ id: 1 }] }).catch(() => {});
    if (!DB.active || !P() || !S().reminder) return;
    let pm = await NLN.checkPermissions();
    if (pm.display !== "granted") { if (!ask) return; pm = await NLN.requestPermissions(); if (pm.display !== "granted") return toast("Notifications are turned off"); }
    const [hh, mm] = (S().remindAt || "19:00").split(":").map(Number);
    await NLN.schedule({ notifications: [{ id: 1, title: "Englow 🦁", body: `Time for English, ${P().name}! Keep your 🔥 streak alive.`, schedule: { on: { hour: hh, minute: mm }, allowWhileIdle: true } }] });
    if (ask) toast(`Reminder set for ${S().remindAt} ⏰`);
  } catch (e) {}
}

// ---------- Ses tanıma (ortak) ----------
async function listenOnce(onStart, onEnd) {
  if (!SR) throw new Error("no-sr");
  if (SR === "native") {
    const pm = await NSR.requestPermissions(); if (pm && pm.speechRecognition && pm.speechRecognition !== "granted") throw new Error("perm");
    onStart(); try { const r = await NSR.start({ language: S().accent, maxResults: 5, partialResults: false, popup: false }); onEnd(); return (r && r.matches) || []; } catch (e) { onEnd(); throw e; }
  }
  return new Promise((res, rej) => { const r = new SR(); r.lang = S().accent; r.interimResults = false; r.maxAlternatives = 5; onStart();
    r.onresult = e => { onEnd(); res([...e.results[0]].map(a => a.transcript)); }; r.onerror = e => { onEnd(); rej(e); }; r.onend = onEnd; try { r.start(); } catch (e) { onEnd(); rej(e); } });
}

    const xp = 10 + score * 3; P().chats[(pro ? "p" : "c") + ci] = true; addXP(xp); P().stats.spoken += score; save(); fireworks(3); beep("win");
    sub(`${c.icon} ${esc(c.t)}`, `${log.join("")}<div class="center"><h1 class="bigpraise">Great conversation!</h1>${tr("Harika bir sohbetti!")}<p>${score}/${c.turns.length} on the first try · +${xp} XP</p></div>
      <button class="btn gold" id="again">Talk again ↻</button><div style="height:8px"></div><button class="btn ghost" id="bb">Back</button>`, () => chatList(pro));
    $("#again").onclick = () => chat(pro, ci); $("#bb").onclick = () => chatList(pro); checkBadges();
  };
  const step = (fresh) => {
    if (k >= c.turns.length) return end();
    const [leo, lt, sample, keys] = c.turns[k];
    sub(`${c.icon} ${esc(c.t)}`, `<div class="chatbox">${pro && !k ? `<div class="rolebar">${c.role === "AGENT" ? "🧑‍💼 You are the team leader. Leo is your agent." : "🎧 You are the agent. Leo is the customer."}</div>` : ""}${log.join("")}${leoB(leo, lt, true)}
      ${hint ? `<div class="hintbox">💡 You could say: <b>${esc(sample)}</b> <button class="spk sm" id="hS">🔊</button></div>` : ""}<div id="fbk"></div></div>
      <div class="cbar"><button class="cbic" id="cH" title="Hint">💡</button><button class="spk mic" id="cM">🎤</button><button class="cbic" id="cK" title="Keyboard">⌨️</button></div>
      <p class="muted center" id="cS" style="margin:6px 0">${SR ? "Tap 🎤 and answer" : "Type your answer"}</p>
      <div id="kbx" class="${kb || !SR ? "" : "hidden"}"><input class="inp" id="cI" placeholder="Type in English…" autocomplete="off" autocapitalize="sentences"><div style="height:8px"></div><button class="btn" id="cG">Send</button></div>`, () => chatList(pro));
    const sp = (t, r = 1) => say(t, r);
    if (fresh) sp(leo);
    $("#cTr").onclick = () => $("#ctr").classList.toggle("hidden"); $("#cRe").onclick = () => sp(leo); $("#cSl").onclick = () => sp(leo, .6);
    $("#cH").onclick = () => { hint = true; step(false); setTimeout(() => sp(sample), 200); }; if ($("#hS")) $("#hS").onclick = () => sp(sample);
    $("#cK").onclick = () => { kb = !kb; $("#kbx").classList.toggle("hidden"); if (kb) $("#cI").focus(); };
    const judge = (alts, typed) => {
      const said = alts[0] || ""; if (!said.trim()) return;
      const ok = !keys ? norm(said).length > 0 : alts.some(a => keys.split("|").some(x => norm(a).includes(norm(x))));
      if (!tries) { skillMark(typed ? "writing" : "speaking", ok); if (ok) score++; }
      if (ok) { beep("ok"); log.push(leoB(leo), youB(said, true)); k++; tries = 0; hint = false; toast(PRAISE[Math.random() * PRAISE.length | 0][0] + " 🦁"); setTimeout(() => step(true), 700); }
      else { tries++; beep("bad"); $("#fbk").innerHTML = youB(said, false) + `<div class="hintbox">Good try! 💪 You could say: <b>${esc(sample)}</b> <button class="spk sm" id="fS">🔊</button>${tr("İyi deneme! Şöyle diyebilirsin.")}<div class="row" style="border:0;gap:8px;margin-top:8px"><button class="btn ghost" id="tA" style="padding:10px">Try again ↻</button><button class="btn" id="nX" style="padding:10px">Next ▶</button></div></div>`;
        $("#fS").onclick = () => sp(sample); $("#tA").onclick = () => step(false); $("#nX").onclick = () => { log.push(leoB(leo), youB(said, false)); k++; tries = 0; hint = false; step(true); };
        $("#fbk").scrollIntoView({ block: "center", behavior: "smooth" }); }
    };
    $("#cG").onclick = () => judge([$("#cI").value], true); $("#cI").onkeydown = e => { if (e.key === "Enter") judge([$("#cI").value], true); };
    $("#cM").onclick = async () => {
      if (!SR) { kb = true; $("#kbx").classList.remove("hidden"); return; }
      try { const alts = await listenOnce(() => { $("#cS").textContent = "Listening… 👂"; $("#cM").classList.add("live"); musicDuck(true); }, () => { const m = $("#cM"); if (m) m.classList.remove("live"); musicDuck(false); });
        judge(alts, false); } catch (e) { $("#cS").textContent = "I couldn't hear you. Tap 🎤 again or use ⌨️."; }
    };
    const cb = document.querySelectorAll(".cb"); if (cb.length) cb[cb.length - 1].scrollIntoView({ block: "center" });
  };
  step(true);
}

// ---------- İlgi alanları pratiği ----------
function interestPractice() {
  const p = P();
  sub("⭐ My Interests", `<p class="muted">Pick your favourite topics. We'll practise 10 words from them.</p>${tr("Sevdiğin konuları seç, onlardan 10 kelime çalışalım.")}

    <button class="btn gold" id="go" ${p.interests.length ? "" : "disabled"}>Practise 10 words ▶</button>`);
  $("#app").querySelectorAll("[data-in]").forEach(b => b.onclick = () => { const k = b.dataset.in; p.interests = p.interests.includes(k) ? p.interests.filter(x => x !== k) : [...p.interests, k]; save(); interestPractice(); });

    const maxT = Math.min(72, Math.max(18, worldOf(p.unlocked) * 9 + 9));

    const ws = pick(pool, 10); ws.forEach(w => { if (!p.words[w.en]) p.words[w.en] = { box: 1, due: Date.now() + 864e5, tr: w.tr, em: w.em, ok: 0 }; }); save();

    hideNav(); L = { n: 0, mode: "review", qs: ws.map((w, i) => ({ t: types[i % types.length], w, pool })), i: 0, first: 0, total: 0, combo: 0, world: null }; lessonBg(); showQ();
  };
}

// ---------- Gelişim raporu: önce / şimdi, indirilebilir ----------
const cefrOf = l => WORLDS[worldOf(Math.max(1, Math.min(80, l))) - 1].cefr;
function weekMinutes(n = 8) {
  const p = P(), out = []; const ws = new Date(weekKey()); 
  for (let i = n - 1; i >= 0; i--) { const st = new Date(ws); st.setDate(st.getDate() - i * 7); let m = 0; for (let d = 0; d < 7; d++) { const x = new Date(st); x.setDate(x.getDate() + d); m += p.minutes[dayKey(x)] || 0; } out.push([`${pad2(st.getDate())}.${pad2(st.getMonth() + 1)}`, Math.round(m)]); }
  return out;
}
function reportData() {
  const p = P(), totalMin = Math.round(Object.values(p.minutes).reduce((a, b) => a + b, 0)), cities = Object.keys(p.stars).filter(k => p.stars[k]).length;
  const days = Math.max(1, Math.round((new Date(today()) - new Date(p.start.date)) / 864e5) + 1);
  return { p, totalMin, cities, days, startL: p.start.lvl, nowL: p.unlocked, words0: p.start.words, words: Object.keys(p.words).length,
    skills: SKILLS.map(([k, i, l, t]) => ({ k, i, l, t, b: skBefore(p.sk[k]), n: skNow(p.sk[k]), cnt: p.sk[k] ? p.sk[k].n : 0 })), weeks: weekMinutes() };
}

   <div class="ba"><div class="bcol"><small>BEFORE</small><b>${cefrOf(d.startL)}</b><span>Level ${d.startL}</span><span>${d.words0} words</span><span>${p.start.date}</span></div><div class="barrow">➜</div>
   <div class="bcol now"><small>NOW</small><b>${cefrOf(d.nowL)}</b><span>Level ${d.nowL}</span><span>${d.words} words</span><span>${today()}</span></div></div>${tr("Başladığın gün ve bugün")}
   <div class="card"><h3>🎯 Skills · first 20 answers → last 20</h3>${tr("Her beceride ilk 20 cevabın ve son 20 cevabın doğruluk oranı")}
    ${d.skills.map(x => `<div class="skrow"><div class="skl">${x.i} <b>${x.l}</b>${showTR() ? ` <span class="muted">${x.t}</span>` : ""}</div>${x.n === null ? `<div class="muted" style="font-size:13px">Not practised yet</div>` : `<div class="skb"><i class="b" style="width:${x.b}%"></i><i class="n" style="width:${x.n}%"></i></div><div class="skv">${x.b}% → <b>${x.n}%</b> ${x.n > x.b ? "📈" : x.n < x.b ? "📉" : "➖"}</div>`}</div>`).join("")}</div>
   <div class="card"><h3>⏱️ Minutes per week</h3><div class="bars gold">${d.weeks.map(([l, m]) => `<div><i style="height:${Math.max(3, m / mx * 60)}px"></i>${l}</div>`).join("")}</div>
    <div class="row"><span>Total time</span><b>${d.totalMin} min</b></div><div class="row"><span>Lessons</span><b>${p.stats.lessons}</b></div><div class="row"><span>Cities visited</span><b>🛂 ${d.cities}/80</b></div><div class="row"><span>Best streak now</span><b>🔥 ${p.streak} days</b></div><div class="row"><span>Words spoken</span><b>🎤 ${p.stats.spoken}</b></div></div>
   <button class="btn gold" id="dl">📥 Download report</button><div style="height:8px"></div>${S().sharePrompts ? `<button class="btn share" id="sr">📤 Share report</button>` : ""}
   <p class="muted center" style="font-size:12px;margin-top:10px">Englow levels follow CEFR as a guide. This report is not an official certificate.</p>`, () => { tab = "me"; render(); });
  $("#dl").onclick = async () => { toast("Preparing your report…"); const img = await reportImage(); downloadImg(img, `Englow-Report-${p.name}-${today()}.png`); };

}
async function downloadImg(dataUrl, fname) {
  if (NATIVE && NFS) { try { await NFS.writeFile({ path: fname, data: dataUrl.split(",")[1], directory: "DOCUMENTS", recursive: true }); toast("Saved to Documents 📁"); return; } catch (e) { return shareOut("Englow progress report", dataUrl, fname); } }
  const a = document.createElement("a"); a.href = dataUrl; a.download = fname; a.click(); toast("Downloaded 📥");
}

  x.textAlign = "left"; x.font = '800 74px "Baloo", sans-serif'; x.fillStyle = "#fff"; x.fillText("ENG", 240, 130); const w1 = x.measureText("ENG").width; x.fillStyle = grad(240 + w1, 240 + w1 + 180); x.fillText("LOW", 240 + w1, 130);

  const box = (bx, label, cefr, l1, l2, hi) => { x.fillStyle = hi ? "rgba(250,204,21,.15)" : "rgba(255,255,255,.07)"; x.beginPath(); x.roundRect ? x.roundRect(bx, 380, 430, 250, 30) : x.rect(bx, 380, 430, 250); x.fill(); x.strokeStyle = hi ? "#facc15" : "rgba(255,255,255,.25)"; x.lineWidth = 3; x.stroke();
    x.textAlign = "center"; x.fillStyle = hi ? "#facc15" : "#cbd5e1"; x.font = '800 30px "Nunito", sans-serif'; x.fillText(label, bx + 215, 430); x.fillStyle = "#fff"; x.font = '800 84px "Baloo", sans-serif'; x.fillText(cefr, bx + 215, 525); x.font = '700 30px "Nunito", sans-serif'; x.fillStyle = "#e2e8f0"; x.fillText(l1, bx + 215, 572); x.fillText(l2, bx + 215, 610); };
  box(60, "BEFORE", cefrOf(d.startL), `Level ${d.startL}`, `${d.words0} words`, false); box(590, "NOW", cefrOf(d.nowL), `Level ${d.nowL}`, `${d.words} words`, true);
  x.textAlign = "center"; x.fillStyle = "#facc15"; x.font = '800 60px "Nunito", sans-serif'; x.fillText("➜", 540, 525);
