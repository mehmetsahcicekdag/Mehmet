plugins { id 'com.android.application' }
android {
    namespace 'com.mehmetsahcicekdag.segem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.firstclass.sigortasinavi'
        minSdk 23
        targetSdk 33
        versionCode 23001
        versionName '2.30.1'
    }
    signingConfigs {
        main {
            storeFile file('../sigorta.keystore')
            storePassword 'SigortaSinavi2026'
            keyAlias 'sigorta'
            keyPassword 'SigortaSinavi2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.main; minifyEnabled false }
        debug { signingConfig signingConfigs.main }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
